function nowISO(offsetSec){
  const d = new Date(Date.now() + (offsetSec||0)*1000);
  const pad = n => String(n).padStart(2,'0');
  const tzoff = -d.getTimezoneOffset();
  const sign = tzoff>=0?'+':'-';
  const tzh = pad(Math.floor(Math.abs(tzoff)/60));
  const tzm = pad(Math.abs(tzoff)%60);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${sign}${tzh}:${tzm}`;
}
function nowLog(offsetSec){
  const d = new Date(Date.now() + (offsetSec||0)*1000);
  const pad = n => String(n).padStart(2,'0');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

  const div = document.createElement('div');

function normalizePath(path, cwd){
  if(!path) return cwd;
  let parts;
  if(path.startsWith('/')) parts = path.split('/');
  else parts = (cwd+'/'+path).split('/');
  const stack=[];
  for(const p of parts){
    if(p===''||p==='.') continue;
    if(p==='..'){ if(stack.length) stack.pop(); continue; }
    stack.push(p);
  }
  return '/'+stack.join('/');
}

function getNode(path, follow){
  path = path.replace(/\/+$/,'')||'/';
  if(path==='') path='/';
  const parts = path.split('/').filter(Boolean);
  let node = FS, cur='';
  for(let i=0;i<parts.length;i++){
    if(node.type!=='d') return null;
    let child = node.children[parts[i]];
    if(!child) return null;
    let depth=0;
    while(child && child.type==='l' && (follow!==false)){
      const tgt = child.target.startsWith('/')?child.target:normalizePath(child.target, '/'+parts.slice(0,i).join('/'));
      const rn = getNode(tgt, true);
      if(!rn){ child=null; break; }
      child = rn;
      depth++; if(depth>10) break;
    }
    node = child;
    if(!node) return null;
  }
  return node;
}
function getParentAndName(path){
  const norm = normalizePath(path, state.cwd);
  const idx = norm.lastIndexOf('/');
  const parentPath = idx===0?'/':norm.slice(0,idx);
  const name = norm.slice(idx+1);
  return {parent:getNode(parentPath), parentPath, name, path:norm};
}

/* ============================================================
   ПАРСЕР BASH (упрощённый, но функциональный)
   ============================================================ */
function tokenize(input){
  const tokens=[]; let i=0; const n=input.length;
  while(i<n){
    while(i<n && /\s/.test(input[i])) i++;
    if(i>=n) break;
    if(['|','&','>','<',';'].includes(input[i])){
      if(input[i]==='&'&&input[i+1]==='&'){ tokens.push('&&'); i+=2; continue; }
      if(input[i]==='|'&&input[i+1]==='|'){ tokens.push('||'); i+=2; continue; }
      if(input[i]==='>'&&input[i+1]==='>'){ tokens.push('>>'); i+=2; continue; }
      tokens.push(input[i]); i++; continue;
    }
    let buf=''; let quote=null;
    while(i<n){
      const c=input[i];
      if(quote){
        if(c===quote){ quote=null; i++; continue; }
        if(quote==='"' && c==='\\' && (input[i+1]==='"'||input[i+1]==='\\'||input[i+1]==='$')){ buf+=input[i+1]; i+=2; continue; }
        buf+=c; i++; continue;
      }
      if(c==='"'||c==="'"){ quote=c; i++; continue; }
      if(/\s/.test(c) || ['|','&','>','<',';'].includes(c)) break;
      if(c==='\\'){ buf+=input[i+1]||''; i+=2; continue; }
      buf+=c; i++;
    }
    tokens.push(buf);
  }
  return tokens;
}

function expandVars(str){
  return str.replace(/\$\{?([A-Za-z_][A-Za-z0-9_]*)\}?/g, (m,name)=>{
    if(name in state.env) return state.env[name];
    if(name in state.vars) return state.vars[name];
    if(name==='?') return String(state.lastStatus);
    return '';
  }).replace(/\$\?/g, ()=>String(state.lastStatus));
}

function splitTop(tokens, seps){
  const groups=[[]]; const joiners=[];
  for(const t of tokens){
    if(seps.includes(t)){ groups.push([]); joiners.push(t); }
    else groups[groups.length-1].push(t);
  }
  return {groups,joiners};
}

/* Выполнение всей командной строки */
function runLine(line){
  line = line.replace(/^\s+|\s+$/g,'');
  if(!line) return;
  state.history.push(line);
  state.histIdx = state.history.length;
  const hist = getNode(state.home+'/.bash_history');
  if(hist) hist.content += line+'\n';

  let tokens = tokenize(line);
  if(!tokens.length) return;

  const {groups:seqGroups} = splitTop(tokens, [';']);
  for(const seqTokens of seqGroups){
    if(!seqTokens.length) continue;
    runAndOrChain(seqTokens);
  }
}

function runAndOrChain(tokens){
  // разбираем && и || с сохранением порядка через простую свёртку слева направо
  let i=0; let lastOk = true; let first=true;
  let cur=[];
  const flush = (op)=>{
    if(!cur.length) return;
    let run = true;
    if(!first){
      if(op==='&&') run = lastOk;
      else if(op==='||') run = !lastOk;
    }
    if(run){ lastOk = (runPipeline(cur)===0); }
    first=false;
    cur=[];
  };
  let pendingOp=null;
  for(const t of tokens){
    if(t==='&&'||t==='||'){ flush(pendingOp); pendingOp=t; continue; }
    cur.push(t);
  }
  flush(pendingOp);
}

function runPipeline(tokens){
  const {groups} = splitTop(tokens, ['|']);
  let stdin = '';
  let code = 0;
  for(let idx=0; idx<groups.length; idx++){
    let g = groups[idx].slice();
    // редиректы
    let outFile=null, appendMode=false, inFile=null;
    const cleaned=[];
    for(let j=0;j<g.length;j++){
      if(g[j]==='>'){ outFile=g[j+1]; j++; continue; }
      if(g[j]==='>>'){ outFile=g[j+1]; appendMode=true; j++; continue; }
      if(g[j]==='<'){ inFile=g[j+1]; j++; continue; }
      cleaned.push(g[j]);
    }
    if(inFile){
      const node = getNode(normalizePath(expandVars(inFile), state.cwd));
      stdin = (node && node.type==='f') ? node.content : '';
    }
    const args = cleaned.map(expandVars);
    if(!args.length) continue;
    // присваивание переменной VAR=val
    if(/^[A-Za-z_][A-Za-z0-9_]*=/.test(args[0]) && args.length===1){
      const [k,...rest]=args[0].split('=');
      state.vars[k]=rest.join('=');
      code=0; continue;
    }
    const cmd = args[0];
    const cargs = args.slice(1);
    const result = execCommand(cmd, cargs, stdin);
    code = result.code;
    if(result.stderr) result.stderr.split('\n').forEach(l=>{ if(l.length) println(`<span class="err">${esc(l)}</span>`); });
    if(outFile){
      const target = getParentAndName(normalizePath(expandVars(outFile), state.cwd));
      if(target.parent && target.parent.type==='d'){
        let node = target.parent.children[target.name];
        if(!node || node.type!=='f'){ node = F(''); target.parent.children[target.name]=node; }
        node.content = appendMode ? (node.content + result.stdout) : result.stdout;
      }
      stdin='';
    } else if(idx < groups.length-1){
      stdin = result.stdout;
    } else {
      if(result.stdout!==undefined && result.stdout!=='' ){
        result.stdout.split('\n').forEach((l,li,arr)=>{
          if(li===arr.length-1 && l==='') return;
          println(esc(l).length?esc(l):'&nbsp;');
        });
      }
    }
  }
  state.lastStatus = code;
  return code;
}

/* ============================================================
   ФОРМАТИРОВАНИЕ ls
   ============================================================ */
function fmtEntry(name, node){
  if(node.type==='d') return `<span class="dir">${esc(name)}</span>`;
  if(node.type==='l') return `<span class="lnk">${esc(name)}</span><span class="dim"> -&gt; ${esc(node.target)}</span>`;
  if(node.mode && node.mode.includes('x')) return `<span class="exe">${esc(name)}</span>`;
  return esc(name);
}

function resolveArgPath(p){ return normalizePath(p, state.cwd); }

function permStr(mode){ return mode; }

function execCommand(cmd, args, stdin){
  const fn = COMMANDS[cmd];
  if(!fn){
    return {stdout:'', stderr:`bash: ${cmd}: command not found`, code:127};
  }
  try{
    return fn(args, stdin) || {stdout:'',stderr:'',code:0};
  }catch(e){
    return {stdout:'', stderr:`${cmd}: internal error: ${e.message}`, code:1};
  }
}

COMMANDS['ls'] = (args)=>{
  let showAll=false, longFmt=false;
  const targets=[];
  for(const a of args){
    if(a.startsWith('-')){
      if(a.includes('a')) showAll=true;
      if(a.includes('l')) longFmt=true;
    } else targets.push(a);
  }
  if(!targets.length) targets.push('.');
  let out=[];
  for(const t of targets){
    const path = resolveArgPath(t);
    const node = getNode(path);
    if(!node) return {stdout:'', stderr:`ls: cannot access '${t}': No such file or directory`, code:2};
    if(node.type!=='d'){
      out.push(longFmt ? `${node.mode} 1 ${node.owner} ${node.group} ${node.content?node.content.length:0} ${fmtEntry(t,node)}` : fmtEntry(t,node));
      continue;
    }
    let names = Object.keys(node.children).sort();
    if(!showAll) names = names.filter(n=>!n.startsWith('.'));
    if(longFmt){
      out.push(`total ${names.length}`);
      names.forEach(n=>{
        const c = node.children[n];
        const size = c.type==='f' ? (c.content?c.content.length:0) : 4096;
        out.push(`${c.mode} 1 ${c.owner} ${c.group} ${String(size).padStart(6)} ${new Date(c.mtime).toDateString().slice(4,10)} ${fmtEntry(n,c)}`);
      });
    } else {
      out.push(names.map(n=>fmtEntry(n,node.children[n])).join('  '));
    }
  }
  return {stdout: out.join('\n')+'\n', code:0};
};

COMMANDS['cd'] = (args)=>{

  if(target==='-') target = state.env.OLDPWD || state.cwd;
  if(target==='~') target = state.home;
  const path = resolveArgPath(target);
  const node = getNode(path);
  if(!node) return {stdout:'', stderr:`bash: cd: ${target}: No such file or directory`, code:1};
  if(node.type!=='d') return {stdout:'', stderr:`bash: cd: ${target}: Not a directory`, code:1};
  state.env.OLDPWD = state.cwd;
  state.cwd = path;
  updatePrompt();
  return {stdout:'', code:0};
};

COMMANDS['mkdir'] = (args)=>{
  let parents=false; const targets=[];
  args.forEach(a=>{ if(a==='-p') parents=true; else targets.push(a); });
  if(!targets.length) return {stdout:'',stderr:'mkdir: missing operand',code:1};
  let err='';
  for(const t of targets){
    const path = resolveArgPath(t);
    if(getNode(path)){ err+=`mkdir: cannot create directory '${t}': File exists\n`; continue; }
    const parts = path.split('/').filter(Boolean);
    let cur = FS; let curPath='';
    for(let i=0;i<parts.length;i++){
      curPath += '/'+parts[i];
      if(!cur.children[parts[i]]){
        if(i<parts.length-1 && !parents){ err+=`mkdir: cannot create directory '${t}': No such file or directory\n`; cur=null; break; }
        cur.children[parts[i]] = D({}, 'drwxr-xr-x', state.user, state.user);
      }
      cur = cur.children[parts[i]];
      if(cur.type!=='d'){ err+=`mkdir: '${t}': Not a directory\n`; cur=null; break; }
    }
  }
  return {stdout:'', stderr: err.trim(), code: err?1:0};
};

COMMANDS['touch'] = (args)=>{
  if(!args.length) return {stdout:'',stderr:'touch: missing file operand',code:1};
  for(const t of args){
    const {parent,name} = getParentAndName(t);
    if(!parent || parent.type!=='d') return {stdout:'',stderr:`touch: cannot touch '${t}': No such file or directory`, code:1};
    if(parent.children[name]) parent.children[name].mtime = Date.now();
    else parent.children[name] = F('', '-rw-r--r--', state.user, state.user);
  }
  return {stdout:'', code:0};
};

COMMANDS['cat'] = (args, stdin)=>{
  if(!args.length) return {stdout: stdin||'', code:0};
  let out=''; let err='';
  for(const t of args){
    const path = resolveArgPath(t);
    const node = getNode(path);
    if(!node){ err+=`cat: ${t}: No such file or directory\n`; continue; }
    if(node.type==='d'){ err+=`cat: ${t}: Is a directory\n`; continue; }
    out += node.content;
    if(!out.endsWith('\n')) out+='\n';
  }
  return {stdout:out, stderr: err.trim(), code: err?1:0};
};

function readFileArgOrStdin(args, stdin){
  if(args.length){
    const node = getNode(resolveArgPath(args[0]));
    if(!node) return {err:`No such file or directory`};
    if(node.type==='d') return {err:`Is a directory`};
    return {text: node.content};
  }
  return {text: stdin||''};
}

COMMANDS['head'] = (args,stdin)=>{
  let n=10; const files=[];
  for(let i=0;i<args.length;i++){ if(args[i]==='-n'){ n=parseInt(args[++i]); } else files.push(args[i]); }
  const r = readFileArgOrStdin(files, stdin);
  if(r.err) return {stdout:'',stderr:`head: ${r.err}`,code:1};
  return {stdout: r.text.split('\n').slice(0,n).join('\n')+'\n', code:0};
};
COMMANDS['tail'] = (args,stdin)=>{
  let n=10; const files=[];
  for(let i=0;i<args.length;i++){ if(args[i]==='-n'){ n=parseInt(args[++i]); } else files.push(args[i]); }
  const r = readFileArgOrStdin(files, stdin);
  if(r.err) return {stdout:'',stderr:`tail: ${r.err}`,code:1};
  const lines = r.text.split('\n'); if(lines[lines.length-1]==='') lines.pop();
  return {stdout: lines.slice(-n).join('\n')+'\n', code:0};
};
COMMANDS['wc'] = (args,stdin)=>{
  const r = readFileArgOrStdin(args.filter(a=>!a.startsWith('-')), stdin);
  if(r.err) return {stdout:'',stderr:`wc: ${r.err}`,code:1};
  const lines = r.text.split('\n').length-1;
  const words = r.text.trim()?r.text.trim().split(/\s+/).length:0;
  const chars = r.text.length;
  if(args.includes('-l')) return {stdout:`${lines}\n`, code:0};
  if(args.includes('-w')) return {stdout:`${words}\n`, code:0};
  return {stdout:`${lines} ${words} ${chars}\n`, code:0};
};
COMMANDS['sort'] = (args,stdin)=>{
  const r = readFileArgOrStdin(args.filter(a=>!a.startsWith('-')), stdin);
  const text = r.err? (stdin||'') : r.text;
  let lines = text.split('\n').filter((l,i,arr)=>!(i===arr.length-1&&l===''));
  lines.sort();
  if(args.includes('-r')) lines.reverse();
  return {stdout: lines.join('\n')+'\n', code:0};
};
COMMANDS['uniq'] = (args,stdin)=>{
  const r = readFileArgOrStdin(args, stdin);
  const text = r.err? (stdin||'') : r.text;
  const lines = text.split('\n');
  const out=[]; let prev=null;
  lines.forEach(l=>{ if(l!==prev) out.push(l); prev=l; });
  return {stdout: out.join('\n')+'\n', code:0};
};
COMMANDS['grep'] = (args,stdin)=>{
  let ignoreCase=false, invert=false; const rest=[];
  args.forEach(a=>{ if(a==='-i') ignoreCase=true; else if(a==='-v') invert=true; else rest.push(a); });
  const pattern = rest[0];
  if(pattern===undefined) return {stdout:'', stderr:'Usage: grep [OPTION]... PATTERN [FILE]...', code:2};
  const files = rest.slice(1);
  let text;
  if(files.length){
    const node = getNode(resolveArgPath(files[0]));
    if(!node) return {stdout:'', stderr:`grep: ${files[0]}: No such file or directory`, code:2};
    text = node.content;
  } else text = stdin||'';
  let re;
  try{ re = new RegExp(pattern, ignoreCase?'i':''); }catch(e){ return {stdout:'',stderr:'grep: invalid pattern',code:2}; }
  const lines = text.split('\n').filter((l,i,arr)=>!(i===arr.length-1&&l===''));
  const matched = lines.filter(l=> invert ? !re.test(l) : re.test(l));
  return {stdout: matched.join('\n')+(matched.length?'\n':''), code: matched.length?0:1};
};
COMMANDS['find'] = (args)=>{
  const start = args[0] && !args[0].startsWith('-') ? args[0] : '.';
  let nameFilter=null;
  const ni = args.indexOf('-name');
  if(ni>=0) nameFilter = args[ni+1].replace(/\*/g,'.*');
  const startPath = resolveArgPath(start);
  const startNode = getNode(startPath);
  if(!startNode) return {stdout:'', stderr:`find: '${start}': No such file or directory`, code:1};
  const out=[];
  (function walk(path,node){
    const base = path.split('/').pop()||'/';
    if(!nameFilter || new RegExp('^'+nameFilter+'$').test(base)) out.push(path||'/');
    if(node.type==='d'){
      Object.keys(node.children).sort().forEach(k=> walk((path==='/'?'':path)+'/'+k, node.children[k]));
    }
  })(startPath===('/')?'':startPath, startNode);
  return {stdout: out.join('\n')+'\n', code:0};
};

COMMANDS['rm'] = (args)=>{
  let recursive=false, force=false; const targets=[];
  args.forEach(a=>{ if(a.startsWith('-')){ if(a.includes('r')) recursive=true; if(a.includes('f')) force=true; } else targets.push(a); });
  let err='';
  for(const t of targets){
    const {parent,name} = getParentAndName(t);
    if(!parent || !parent.children[name]){ if(!force) err+=`rm: cannot remove '${t}': No such file or directory\n`; continue; }
    const node = parent.children[name];
    if(node.type==='d' && !recursive){ err+=`rm: cannot remove '${t}': Is a directory\n`; continue; }
    delete parent.children[name];
  }
  return {stdout:'', stderr: err.trim(), code: err?1:0};
};
COMMANDS['rmdir'] = (args)=>{
  let err='';
  for(const t of args){
    const {parent,name} = getParentAndName(t);
    const node = parent && parent.children[name];
    if(!node){ err+=`rmdir: failed to remove '${t}': No such file or directory\n`; continue; }
    if(node.type!=='d'){ err+=`rmdir: failed to remove '${t}': Not a directory\n`; continue; }
    if(Object.keys(node.children).length){ err+=`rmdir: failed to remove '${t}': Directory not empty\n`; continue; }
    delete parent.children[name];
  }
  return {stdout:'', stderr:err.trim(), code: err?1:0};
};
COMMANDS['cp'] = (args)=>{
  let recursive=false; const rest=[];
  args.forEach(a=>{ if(a==='-r'||a==='-R') recursive=true; else rest.push(a); });
  if(rest.length<2) return {stdout:'',stderr:'cp: missing file operand',code:1};
  const src = getNode(resolveArgPath(rest[0]));
  if(!src) return {stdout:'',stderr:`cp: cannot stat '${rest[0]}': No such file or directory`, code:1};
  if(src.type==='d' && !recursive) return {stdout:'',stderr:`cp: -r not specified; omitting directory '${rest[0]}'`, code:1};
  const {parent,name} = getParentAndName(rest[1]);
  if(!parent) return {stdout:'',stderr:`cp: cannot create '${rest[1]}'`, code:1};
  parent.children[name] = JSON.parse(JSON.stringify(src));
  return {stdout:'', code:0};
};
COMMANDS['mv'] = (args)=>{
  if(args.length<2) return {stdout:'',stderr:'mv: missing file operand',code:1};
  const {parent:sp, name:sn} = getParentAndName(args[0]);
  if(!sp || !sp.children[sn]) return {stdout:'',stderr:`mv: cannot stat '${args[0]}': No such file or directory`, code:1};
  const node = sp.children[sn];
  let destPath = resolveArgPath(args[1]);
  const destNode = getNode(destPath);
  if(destNode && destNode.type==='d'){
    destPath = destPath.replace(/\/+$/,'')+'/'+sn;
  }
  const {parent:dp, name:dn} = getParentAndName(destPath);
  if(!dp) return {stdout:'',stderr:`mv: cannot move to '${args[1]}'`, code:1};
  dp.children[dn]=node;
  delete sp.children[sn];
  return {stdout:'',code:0};
};

COMMANDS['tree'] = (args)=>{
  const start = resolveArgPath(args[0]||'.');
  const node = getNode(start);
  if(!node) return {stdout:'',stderr:'tree: not found',code:1};
  const lines=[start];
  (function walk(n, prefix){
    const keys = Object.keys(n.children||{}).sort();
    keys.forEach((k,i)=>{
      const last = i===keys.length-1;
      lines.push(prefix + (last?'└── ':'├── ') + k);
      if(n.children[k].type==='d') walk(n.children[k], prefix + (last?'    ':'│   '));
    });
  })(node, '');
  return {stdout: lines.join('\n')+'\n', code:0};
};

COMMANDS['pacman'] = (args)=>{
  if(!args.length) return {stdout:'', stderr:'error: no operation specified (use -h for help)', code:1};
  const op = args[0];
  const rest = args.slice(1);
  const flags = rest.filter(a=>a.startsWith('-'));
  const pkgs = rest.filter(a=>!a.startsWith('-'));

  if(op==='-Ss' || (op==='-S' && flags.includes('-s')) || flags.includes('--search')){
    const term = pkgs[0]||'';
    const re = new RegExp(term,'i');
    const hits = Object.entries(REPO).filter(([n,d])=> re.test(n) || re.test(d.desc));
    if(!hits.length) return {stdout:'', code:0};
    let out='';
    hits.forEach(([n,d])=>{
      out += `${d.repo}/${n} ${d.v}${INSTALLED[n]?' [installed]':''}\n    ${d.desc}\n`;
    });
    return {stdout: out, code:0};
  }

  if(op==='-S' || op==='-Sy' || op==='-Syu' || op==='--sync'){
    if(op==='-Sy'||op==='-Syu'){
      println(':: Synchronizing package databases...');
      println(' core                                    130.2 KiB   890 KiB/s 00:00 [######################] 100%');
      println(' extra                                   2450.1 KiB  3.1 MiB/s 00:01 [######################] 100%');
      println(' community                                980.4 KiB  2.4 MiB/s 00:00 [######################] 100%');
      if(op==='-Sy'){ pacmanLog('[PACMAN] synchronizing package lists'); return {stdout:'',code:0}; }
    }
    if(!pkgs.length){
      if(op==='-Syu') return {stdout:' there is nothing to do\n', code:0};
      return {stdout:'', stderr:'error: no targets specified (use -h for help)', code:1};
    }
    const notFound = pkgs.filter(p=>!REPO[p]);
    if(notFound.length){
      let err = notFound.map(p=>`error: target not found: ${p}`).join('\n');
      return {stdout:'', stderr: err, code:1};
    }
    const toInstall = pkgs.filter(p=>!INSTALLED[p]);
    if(!toInstall.length){
      return {stdout:'', stdout2:'', code:0, stdout:' there is nothing to do\n'};
    }
    println('resolving dependencies...');
    println('looking for conflicting packages...');
    println('');
    println('Packages (' + toInstall.length + ') ' + toInstall.map(p=>`${p}-${REPO[p].v}`).join('  '));
    println('');
    const totalSize = toInstall.reduce((s,p)=>s+REPO[p].size,0);
    println(`Total Download Size:   ${(totalSize/1024).toFixed(2)} MiB`);
    println(`Total Installed Size:  ${(totalSize/1024).toFixed(2)} MiB`);
    println('');
    state.pendingConfirm = {
      type:'install', pkgs: toInstall,
      question: ':: Proceed with installation? [Y/n] '
    };
    return {stdout:'', code:0, suppressPrompt:true};
  }

  if(op==='-R' || op==='-Rs' || op==='--remove'){
    if(!pkgs.length) return {stdout:'',stderr:'error: no targets specified (use -h for help)', code:1};
    const notInstalled = pkgs.filter(p=>!INSTALLED[p]);
    if(notInstalled.length){
      return {stdout:'', stderr: notInstalled.map(p=>`error: target not found: ${p}`).join('\n'), code:1};
    }
    println('checking dependencies...');
    println('');
    println('Packages (' + pkgs.length + ') ' + pkgs.map(p=>`${p}-${INSTALLED[p].v}`).join('  '));
    println('');
    state.pendingConfirm = { type:'remove', pkgs, question:':: Do you want to remove these packages? [Y/n] ' };
    return {stdout:'', code:0, suppressPrompt:true};
  }

  if(op==='-Q' || op==='--query'){
    if(flags.includes('-i') || rest.includes('-i')){
      const p = pkgs[0];
      if(!p || !INSTALLED[p]) return {stdout:'',stderr:`error: package '${p}' was not found`, code:1};
      const d = REPO[p];
      return {stdout: `Name            : ${p}\nVersion         : ${INSTALLED[p].v}\nDescription     : ${d.desc}\nInstalled Size  : ${(d.size/1024).toFixed(2)} MiB\nInstall Reason  : ${INSTALLED[p].explicit?'Explicitly installed':'Installed as a dependency'}\n`, code:0};
    }
    if(pkgs.length){
      const p = pkgs[0];
      if(!INSTALLED[p]) return {stdout:'',stderr:`error: package '${p}' was not found`, code:1};
      return {stdout:`${p} ${INSTALLED[p].v}\n`, code:0};
    }
    const names = Object.keys(INSTALLED).sort();
    return {stdout: names.map(n=>`${n} ${INSTALLED[n].v}`).join('\n')+'\n', code:0};
  }

  return {stdout:'', stderr:`error: invalid option: '${op}'`, code:1};
};

function finalizePacmanConfirm(answer){
  const pc = state.pendingConfirm;
  state.pendingConfirm = null;
  const yes = !answer || /^y(es)?$/i.test(answer.trim());
  if(!yes){ println('interrupt (использование отменено)'); return; }
  if(pc.type==='install'){
    println(':: Proceed with installation? [Y/n] ' + (answer||'Y'));
    pc.pkgs.forEach(p=>{
      println(`downloading ${p}-${REPO[p].v}-x86_64.pkg.tar.zst...`);
    });
    println('checking keys in keyring...');
    println('checking package integrity...');
    println('loading package files...');
    println('checking for file conflicts...');
    println('checking available disk space...');
    pc.pkgs.forEach((p,i)=>{
      println(`(${i+1}/${pc.pkgs.length}) installing ${p}...`);
      const node = getNode('/var/lib/pacman/local');
      if(node) node.children[`${p}-${REPO[p].v}`] = D({desc: F(`%NAME%\n${p}\n\n%VERSION%\n${REPO[p].v}\n`)});
      INSTALLED[p] = {v: REPO[p].v, explicit:true, date:Date.now()};
      pacmanLog(`[ALPM] installed ${p} (${REPO[p].v})`);
    });
    println('');
  } else if(pc.type==='remove'){
    println(':: Do you want to remove these packages? [Y/n] ' + (answer||'Y'));
    pc.pkgs.forEach((p,i)=>{
      println(`(${i+1}/${pc.pkgs.length}) removing ${p}...`);
      delete INSTALLED[p];
      pacmanLog(`[ALPM] removed ${p}`);
    });
    println('');
  }
}

cmdInput.addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){
    const raw = cmdInput.value;
    if(!state.loggedIn){
      cmdInput.value='';
      handleLoginFlow(raw);
      return;
    }
    // строка команды + эхо
    const promptHtml = promptSpan.innerHTML;
    println(promptHtml + esc(raw));
    cmdInput.value='';

    if(state.pendingConfirm){
      finalizePacmanConfirm(raw);
      updatePrompt();
      scrollDown();
      return;
    }

    runLine(raw);
    updatePrompt();
    scrollDown();
    return;
  }
  if(e.key==='ArrowUp'){
    if(state.history.length){
      state.histIdx = Math.max(0, state.histIdx-1);
      cmdInput.value = state.history[state.histIdx]||'';
      e.preventDefault();
    }
  }
  if(e.key==='ArrowDown'){
    if(state.history.length){
      state.histIdx = Math.min(state.history.length, state.histIdx+1);
      cmdInput.value = state.history[state.histIdx]||'';
      e.preventDefault();
    }
  }
  if(e.key==='l' && e.ctrlKey){ e.preventDefault(); logEl.innerHTML=''; }
});
screenEl.addEventListener('click', ()=>{ if(editorOverlay.style.display!=='flex') cmdInput.focus(); });
