<!DOCTYPE html>

  .line{white-space:pre-wrap;min-height:1.2em;}
  .prompt-user{color:#5fd75f;font-weight:700;}
  .prompt-host{color:#5fd75f;font-weight:700;}
  .prompt-path{color:#5fafff;font-weight:700;}
  .prompt-sym{color:#d4d4d4;}
  .dim{color:#6a7a6a;}
  .err{color:#ff6b6b;}
  .warn{color:#e5c07b;}
  .ok{color:#98c379;}
  .dir{color:#5fafff;font-weight:700;}
  .exe{color:#98c379;font-weight:700;}
  .lnk{color:#56b6c2;}
  .cyanb{color:#56b6c2;font-weight:700;}
  #inputRow{display:none;align-items:center;}
  #promptSpan{white-space:pre;}
  #cmdInput{
    flex:1;background:transparent;border:none;outline:none;color:#d4d4d4;
    font-family:'JetBrains Mono',monospace;font-size:14px;caret-color:#d4d4d4;
    min-width:60px;
  }
  #editorOverlay{

    font-family:'JetBrains Mono',monospace;font-size:14px;flex-direction:column;z-index:100;
    border:2px solid #2a3a2a;

function nowISO(offsetSec) {
  const d = new Date(Date.now() + (offsetSec||0)*1000);
  const pad=n=>String(n).padStart(2,'0');
  const tz=-d.getTimezoneOffset(); const s=tz>=0?'+':'-';
  const h=pad(Math.floor(Math.abs(tz)/60)); const m=pad(Math.abs(tz)%60);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${s}${h}:${m}`;
}
function nowLog(offsetSec) {
  const d=new Date(Date.now()+(offsetSec||0)*1000);
  const pad=n=>String(n).padStart(2,'0');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let FS = buildFS();

// ---- функции работы с путями (исправлены типы) ----
function normalizePath(path, cwd){
  // Приводим к строке всегда
  path = String(path || '');
  cwd = String(cwd || '/');
  if(!path) return cwd;
  let parts = path.startsWith('/') ? path.split('/') : (cwd + '/' + path).split('/');
  const stack=[];
  for(const p of parts){
    if(p===''||p==='.') continue;
    if(p==='..'){if(stack.length)stack.pop(); continue;}
    stack.push(p);
  }
  return '/'+stack.join('/');
}
function getNode(path, follow){
  path = String(path || '');
  path=path.replace(/\/+$/,'')||'/';
  if(path==='') path='/';
  const parts=path.split('/').filter(Boolean);
  let node=FS;
  for(let i=0;i<parts.length;i++){
    if(node.type!=='d') return null;
    let child=node.children[parts[i]];
    if(!child) return null;
    let depth=0;
    while(child && child.type==='l' && follow!==false){
      const tgt=child.target.startsWith('/')?child.target:normalizePath(child.target, '/'+parts.slice(0,i).join('/'));
      const rn=getNode(tgt,true);
      if(!rn){child=null; break;}
      child=rn; depth++; if(depth>10) break;
    }
    node=child; if(!node) return null;
  }
  return node;
}
function getParentAndName(path){
  const norm=normalizePath(path, state.cwd);
  const idx=norm.lastIndexOf('/');
  const parentPath=idx===0?'/':norm.slice(0,idx);
  const name=norm.slice(idx+1);
  return {parent:getNode(parentPath), parentPath, name, path:norm};
}
function resolvePath(p){return normalizePath(p,state.cwd);}

// ====================================================================
function tokenize(input){
  input = String(input || '');
 const tokens=[]; let i=0,n=input.length;
 while(i<n){
  while(i<n&&/\s/.test(input[i])) i++;
  if(i>=n) break;
  if(['|','&','>','<',';','(',')'].includes(input[i])){
   if(input[i]==='&'&&input[i+1]==='&'){tokens.push('&&');i+=2;continue;}
   if(input[i]==='|'&&input[i+1]==='|'){tokens.push('||');i+=2;continue;}
   if(input[i]==='>'&&input[i+1]==='>'){tokens.push('>>');i+=2;continue;}
   tokens.push(input[i]); i++; continue;
  }
  let buf='', quote=null;
  while(i<n){
   const c=input[i];
   if(quote){
    if(c===quote){quote=null;i++;continue;}
    if(quote==='"'&&c==='\\'&&(input[i+1]==='"'||input[i+1]==='\\'||input[i+1]==='$')){buf+=input[i+1];i+=2;continue;}
    buf+=c;i++; continue;
   }
   if(c==='"'||c==="'"){quote=c;i++;continue;}
   if(/\s/.test(c)||['|','&','>','<',';','(',')'].includes(c)) break;
   if(c==='\\'){buf+=input[i+1]||'';i+=2;continue;}
   buf+=c;i++;
  }
  if(buf) tokens.push(buf);
 }
 return tokens;
}
function expandVars(str){
 str = String(str || '');
 return str.replace(/\$\{?([A-Za-z_][A-Za-z0-9_]*)\}?/g,(m,name)=>{
  if(name in state.env)return state.env[name];
  if(name in state.vars)return state.vars[name];
  if(name==='?')return String(state.lastStatus);
  if(name==='$')return String(process.pid||0);
  return '';
 }).replace(/\$\?/g,()=>String(state.lastStatus))
 .replace(/\$\(\(([^)]+)\)\)/g,(m,expr)=>String(evalArithmetic(expr)))
 .replace(/\$\(([^)]+)\)/g,(m,cmd)=>runSubshell(cmd))
 .replace(/`([^`]+)`/g,(m,cmd)=>runSubshell(cmd));
}
function evalArithmetic(expr){try{return String(eval(expr))}catch(e){return '0';}}
function runSubshell(cmd){
 const oldCwd=state.cwd;
 const oldEnv=JSON.parse(JSON.stringify(state.env));
 const oldPwd=state.env.PWD;
 const oldOldPwd=state.env.OLDPWD;
 const res=runLineRaw(cmd);
 state.cwd=oldCwd;
 state.env=oldEnv;
 state.env.PWD=oldPwd;
 state.env.OLDPWD=oldOldPwd;
 return res.stdout||'';
}
function splitTop(tokens,seps){const groups=[[]];const joiners=[];for(const t of tokens){if(seps.includes(t)){groups.push([]);joiners.push(t);}else groups[groups.length-1].push(t);}return {groups,joiners};}

// ВЫПОЛНЕНИЕ КОМАНДНОЙ СТРОКИ
// ====================================================================
function runLine(line){
 line=String(line||'').replace(/^\s+|\s+$/g,'');
 if(!line) return;
 state.history.push(line); state.histIdx=state.history.length;
 const hist=getNode(state.home+'/.bash_history');if(hist)hist.content+=line+'\n';
 const trimmed=line.trim();
 if(trimmed.startsWith('if ')){
  return handleIf(trimmed);
 } else if(trimmed.startsWith('for ')){
  return handleFor(trimmed);
 } else if(trimmed.startsWith('while ')){
  return handleWhile(trimmed);
 } else if(trimmed.startsWith('until ')){
  return handleUntil(trimmed);
 } else if(trimmed.startsWith('case ')){
  return handleCase(trimmed);
 } else if(trimmed.startsWith('function ')||trimmed.match(/^[A-Za-z_][A-Za-z0-9_]*\s*\(\)\s*\{/)){
  return handleFunction(trimmed);
 } else {
  const tokens=tokenize(line);
  if(!tokens.length)return;
  const {groups:seqGroups}=splitTop(tokens,[';']);
  for(const seqTokens of seqGroups){
   if(!seqTokens.length)continue;
   runAndOrChain(seqTokens);
  }
 }
}
function handleIf(line){
 let parts=line.split(';');
 let cond='', thenPart='', elsePart='';
 let state='cond';
 for(let p of parts){
  p=p.trim();
  if(state==='cond' && p.startsWith('if ')){
   cond=p.substring(3).trim();
   state='then';
  } else if(state==='then' && p.startsWith('then')){
   thenPart=p.substring(4).trim();
   state='else';
  } else if(state==='else' && p.startsWith('else')){
   elsePart=p.substring(4).trim();
   state='fi';
  } else if(state==='fi' && p==='fi'){
   break;
  } else {
   if(state==='cond') cond+=' '+p;
   else if(state==='then') thenPart+=' '+p;
   else if(state==='else') elsePart+=' '+p;
  }
 }
 const res=runLineRaw(cond);
 if(res.code===0){
  if(thenPart) runLineRaw(thenPart);
 } else {
  if(elsePart) runLineRaw(elsePart);
 }
}
function handleFor(line){
 let parts=line.split(';');
 let varName='', list=[], cmds='';
 let state='var';
 for(let p of parts){
  p=p.trim();
  if(state==='var' && p.startsWith('for ')){
   const rest=p.substring(4).trim();
   const m=rest.match(/^([A-Za-z_][A-Za-z0-9_]*)\s+in\s+(.+)$/);
   if(m){varName=m[1]; list=m[2].split(/\s+/); state='do';}
  } else if(state==='do' && p==='do'){
   state='done';
  } else if(state==='done' && p==='done'){
   break;
  } else {
   if(state==='do'||state==='done') cmds+=' '+p;
  }
 }
 for(const item of list){
  state.vars[varName]=item;
  runLineRaw(cmds);
 }
}
function handleWhile(line){
 let parts=line.split(';');
 let cond='', cmds='';
 let state='cond';
 for(let p of parts){
  p=p.trim();
  if(state==='cond' && p.startsWith('while ')){
   cond=p.substring(6).trim();
   state='do';
  } else if(state==='do' && p==='do'){
   state='done';
  } else if(state==='done' && p==='done'){
   break;
  } else {
   if(state==='do'||state==='done') cmds+=' '+p;
  }
 }
 while(true){
  const res=runLineRaw(cond);
  if(res.code!==0) break;
  runLineRaw(cmds);
 }
}
function handleUntil(line){
 let parts=line.split(';');
 let cond='', cmds='';
 let state='cond';
 for(let p of parts){
  p=p.trim();
  if(state==='cond' && p.startsWith('until ')){
   cond=p.substring(6).trim();
   state='do';
  } else if(state==='do' && p==='do'){
   state='done';
  } else if(state==='done' && p==='done'){
   break;
  } else {
   if(state==='do'||state==='done') cmds+=' '+p;
  }
 }
 while(true){
  const res=runLineRaw(cond);
  if(res.code===0) break;
  runLineRaw(cmds);
 }
}
function handleCase(line){ return; }
function handleFunction(line){
 let m=line.match(/^(?:function\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*\(\)\s*\{/);
 if(!m) return;
 const name=m[1];
 const body=line.substring(line.indexOf('{')+1, line.lastIndexOf('}')).trim();
 if(!state.functions) state.functions={};
 state.functions[name]=body;
}
function runLineRaw(line){
 const oldLog=[], oldPrint=println;
 let out='', err='';
 println=(s)=>{out+=s+'\n';};
 const res=execLine(line);
 println=oldPrint;
 return {stdout:out, stderr:err, code:res?res.code||0:0};
}
function execLine(line){
 const tokens=tokenize(line);
 if(!tokens.length)return {code:0};
 const {groups:seqGroups}=splitTop(tokens,[';']);
 let code=0;
 for(const seqTokens of seqGroups){
  if(!seqTokens.length)continue;
  code=runAndOrChain(seqTokens);
 }
 return {code};
}
function runAndOrChain(tokens){
 let lastOk=true,first=true;
 let cur=[];
 const flush=(op)=>{
  if(!cur.length)return;
  let run=true;
  if(!first){
   if(op==='&&') run=lastOk;
   else if(op==='||') run=!lastOk;
  }
  if(run){lastOk=(runPipeline(cur)===0);}
  first=false; cur=[];
 };
 let pendingOp=null;
 for(const t of tokens){
  if(t==='&&'||t==='||'){flush(pendingOp);pendingOp=t;continue;}
  cur.push(t);
 }
 flush(pendingOp);
 return lastOk?0:1;
}
function runPipeline(tokens){
 const {groups}=splitTop(tokens,['|']);
 let stdin='';
 let code=0;
 for(let idx=0;idx<groups.length;idx++){
  let g=groups[idx].slice();
  let outFile=null, appendMode=false, inFile=null;
  const cleaned=[];
  for(let j=0;j<g.length;j++){
   if(g[j]==='>'){outFile=g[j+1];j++;continue;}
   if(g[j]==='>>'){outFile=g[j+1];appendMode=true;j++;continue;}
   if(g[j]==='<'){inFile=g[j+1];j++;continue;}
   cleaned.push(g[j]);
  }
  if(inFile){
   const node=getNode(normalizePath(expandVars(inFile),state.cwd));
   stdin=(node&&node.type==='f')?node.content:'';
  }
  const args=cleaned.map(expandVars);
  if(!args.length)continue;
  if(/^[A-Za-z_][A-Za-z0-9_]*=/.test(args[0])&&args.length===1){
   const [k,...r]=args[0].split('=');state.vars[k]=r.join('=');code=0;continue;
  }
  const cmd=args[0];
  const cargs=args.slice(1);
  const result=execCommand(cmd,cargs,stdin);
  code=result.code;
  if(result.stderr) result.stderr.split('\n').forEach(l=>{if(l.length)println(`<span class="err">${esc(l)}</span>`);});
  if(outFile){
   const target=getParentAndName(normalizePath(expandVars(outFile),state.cwd));
   if(target.parent&&target.parent.type==='d'){
    let node=target.parent.children[target.name];
    if(!node||node.type!=='f'){node=F('');target.parent.children[target.name]=node;}
    node.content=appendMode?(node.content+result.stdout):result.stdout;
   }
   stdin='';
  } else if(idx<groups.length-1){
   stdin=result.stdout;
  } else {
   if(result.stdout!==undefined&&result.stdout!==''){
    result.stdout.split('\n').forEach((l,li,arr)=>{
     if(li===arr.length-1&&l==='')return;
     println(esc(l).length?esc(l):'&nbsp;');
    });
   }
  }
 }
 state.lastStatus=code;
 return code;
}

function resolveArgPath(p){return normalizePath(p,state.cwd);}
function execCommand(cmd,args,stdin){
 const fn=COMMANDS[cmd];
 if(!fn){
  if(state.functions && state.functions[cmd]){
   const body=state.functions[cmd];
   for(let i=0;i<args.length;i++) state.vars[String(i+1)]=args[i];
   state.vars['#']=String(args.length);
   state.vars['0']=cmd;
   const res=runLineRaw(body);
   for(let i=0;i<args.length;i++) delete state.vars[String(i+1)];
   delete state.vars['#'];
   delete state.vars['0'];
   return {stdout:res.stdout,stderr:res.stderr,code:res.code};
  }
  return {stdout:'',stderr:`bash: ${cmd}: command not found`,code:127};
 }
 try {
  const r=fn(args,stdin);
  if(r&&r.code===undefined) r.code=0;
  if(!r) return {stdout:'',stderr:'',code:0};
  return r;
 } catch(e){return {stdout:'',stderr:`${cmd}: internal error: ${e.message}`,code:1};}
}

const COMMANDS={};

// ---- встроенные ----
COMMANDS['pwd']=()=>({stdout:state.cwd+'\n',code:0});
COMMANDS['whoami']=()=>({stdout:state.user+'\n',code:0});
COMMANDS['id']=()=>({stdout:`uid=${state.uid}(${state.user}) gid=${state.gid}(${state.user==='root'?'root':'sinto'}) groups=${state.uid===0?'0(root)':'1000(sinto),10(wheel)'}\n`,code:0});
COMMANDS['hostname']=(args)=>{if(args.length){HOSTNAME=args[0];getNode('/etc/hostname').content=HOSTNAME+'\n';state.env.HOSTNAME=HOSTNAME;return {stdout:'',code:0};}return {stdout:HOSTNAME+'\n',code:0};};
COMMANDS['uname']=(args)=>{if(args.includes('-a'))return {stdout:`Linux ${HOSTNAME} 6.10.4-arch1-1 #1 SMP PREEMPT_DYNAMIC ${nowLog(0)} x86_64 GNU/Linux\n`,code:0};if(args.includes('-r'))return {stdout:'6.10.4-arch1-1\n',code:0};if(args.includes('-n'))return {stdout:HOSTNAME+'\n',code:0};if(args.includes('-m'))return {stdout:'x86_64\n',code:0};return {stdout:'Linux\n',code:0};};
COMMANDS['date']=()=>({stdout:new Date().toString()+'\n',code:0});
COMMANDS['echo']=(args)=>{let esc=false;let a=args;if(a[0]==='-e'){esc=true;a=a.slice(1);}else if(a[0]==='-n'){return {stdout:a.slice(1).join(' '),code:0};}let s=a.join(' ');if(esc)s=s.replace(/\\n/g,'\n').replace(/\\t/g,'\t').replace(/\\\\/g,'\\');return {stdout:s+'\n',code:0};};
COMMANDS['clear']=()=>{logEl.innerHTML='';return {stdout:'',code:0};};
COMMANDS['history']=()=>({stdout:state.history.map((l,i)=>`  ${i+1}  ${l}`).join('\n')+'\n',code:0});
COMMANDS['export']=(args)=>{args.forEach(a=>{const [k,...r]=a.split('=');if(k)state.env[k]=r.join('=');});return {stdout:'',code:0};};

COMMANDS['ls']=(args)=>{
 let showAll=false,longFmt=false;
 const targets=[];
 for(const a of args){if(a.startsWith('-')){if(a.includes('a'))showAll=true;if(a.includes('l'))longFmt=true;}else targets.push(a);}
 if(!targets.length)targets.push('.');
 let out=[];
 for(const t of targets){
  const path=resolveArgPath(t);const node=getNode(path);
  if(!node)return {stdout:'',stderr:`ls: cannot access '${t}': No such file or directory`,code:2};
  if(node.type!=='d'){out.push(longFmt?`${node.mode} 1 ${node.owner} ${node.group} ${node.content?node.content.length:0} ${fmtEntry(t,node)}`:fmtEntry(t,node));continue;}
  let names=Object.keys(node.children).sort();if(!showAll)names=names.filter(n=>!n.startsWith('.'));
  if(longFmt){out.push(`total ${names.length}`);names.forEach(n=>{const c=node.children[n];const size=c.type==='f'?(c.content?c.content.length:0):4096;out.push(`${c.mode} 1 ${c.owner} ${c.group} ${String(size).padStart(6)} ${new Date(c.mtime).toDateString().slice(4,10)} ${fmtEntry(n,c)}`);});}else{out.push(names.map(n=>fmtEntry(n,node.children[n])).join('  '));}
 }
 return {stdout:out.join('\n')+'\n',code:0};
};

COMMANDS['rm']=(args)=>{
  let recursive=false,force=false, preserveRoot=true;
  const targets=[];
  for(const a of args){
    if(a.startsWith('-')){
      if(a.includes('r')||a.includes('R')) recursive=true;
      if(a.includes('f')) force=true;
      if(a.includes('--no-preserve-root')) preserveRoot=false;
    } else targets.push(a);
  }
  if(!targets.length) return {stdout:'', stderr:'rm: missing operand', code:1};
  let err='';
  for(const t of targets){
    const path = normalizePath(t, state.cwd);
    if(path === '/' && preserveRoot) {
      err += `rm: it is dangerous to operate recursively on '/' \nrm: use --no-preserve-root to override this failsafe\n`;
      continue;
    }
    const {parent,name}=getParentAndName(t);
    if(!parent || !parent.children[name]){
      if(!force) err += `rm: cannot remove '${t}': No such file or directory\n`;
      continue;
    }
    const node=parent.children[name];
    if(node.type==='d' && !recursive){
      err += `rm: cannot remove '${t}': Is a directory\n`;
      continue;
    }
    delete parent.children[name];
  }
  return {stdout:'', stderr:err.trim(), code:err?1:0};
};

COMMANDS['hostnamectl']=(args)=>{if(args.length){HOSTNAME=args.join(' ');getNode('/etc/hostname').content=HOSTNAME+'\n';state.env.HOSTNAME=HOSTNAME;return {stdout:'',code:0};}return {stdout:`   Static hostname: ${HOSTNAME}\n   Operating System: SintOS\n       Kernel: Linux 6.10.4-arch1-1\n Architecture: x86-64\n`,code:0};};

// ---- пользователи ----
COMMANDS['passwd']=()=>{return {stdout:'passwd: password updated successfully\n',code:0};};
COMMANDS['useradd']=(args)=>{const name=args[args.length-1];if(!name)return {stdout:'',stderr:'useradd: missing operand',code:1};const passwd=getNode('/etc/passwd');if(passwd.content.includes(name+':'))return {stdout:'',stderr:`useradd: user '${name}' already exists`,code:9};const uid=1001+Object.keys(FS.children.home.children).length;passwd.content+=`${name}:x:${uid}:${uid}::/home/${name}:/bin/bash\n`;FS.children.home.children[name]=D({'.bashrc':F('PS1="[\\\\u@\\\\h \\\\W]$ "\\n')});return {stdout:'',code:0};};
COMMANDS['userdel']=(args)=>{const name=args[args.length-1];if(!name)return {stdout:'',stderr:'userdel: missing operand',code:1};const passwd=getNode('/etc/passwd');if(!passwd.content.includes(name+':'))return {stdout:'',stderr:`userdel: user '${name}' does not exist`,code:6};passwd.content=passwd.content.split('\n').filter(l=>!l.startsWith(name+':')).join('\n');delete FS.children.home.children[name];return {stdout:'',code:0};};

// ---- редакторы ----
const editorOverlay=document.getElementById('editorOverlay');

function openEditor(path){const norm=resolveArgPath(path);let node=getNode(norm);if(!node){const {parent,name}=getParentAndName(path);if(!parent){printlnText(`nano: cannot create ${path}`);return;}node=F('');parent.children[name]=node;}editingPath=norm;editorFileName.textContent=norm;editorArea.value=node.content;editorOverlay.style.display='flex';editorArea.focus();}
function saveEditor(){const {parent,name}=getParentAndName(editingPath);if(!parent)return;let node=parent.children[name];if(!node||node.type!=='f'){node=F('');parent.children[name]=node;}node.content=editorArea.value;node.mtime=Date.now();}

COMMANDS['nano']=(args)=>{if(!args[0])return {stdout:'',stderr:'Usage: nano <file>',code:1};openEditor(args[0]);return {stdout:'',code:0};};

function readFileArgOrStdin(args, stdin){
 if(args.length){
  const node=getNode(resolveArgPath(args[0]));
  if(!node)return {err:`No such file or directory`};

// ====================================================================
// PACMAN (улучшенный)
// ====================================================================
COMMANDS['pacman']=(args)=>{
 if(!args.length)return {stdout:'',stderr:'error: no operation specified (use -h for help)',code:1};
 const op=args[0];const rest=args.slice(1);const flags=rest.filter(a=>a.startsWith('-'));const pkgs=rest.filter(a=>!a.startsWith('-'));
 const hasFlag=f=>flags.some(fl=>fl.includes(f));

 // Поиск пакетов в репозитории
 if(op==='-Ss'||op==='--search'||(op==='-S'&&hasFlag('s'))){
  const term=pkgs[0]||'';const re=new RegExp(term,'i');const hits=Object.entries(REPO).filter(([n,d])=>re.test(n)||re.test(d.desc));
  if(!hits.length)return {stdout:'',code:0};
  let out='';
  for(const [n,d] of hits){out+=`${d.repo}/${n} ${d.v}${INSTALLED[n]?' [installed]':''}\n    ${d.desc}\n`;}
  return {stdout:out,code:0};
 }

 // Синхронизация
 if(op==='-Sy'||op==='-Syy'||op==='-Syu'||op==='-Syu'||op==='--sync'){
  if(op==='-Sy'||op==='-Syy'||op==='-Syu'){
   println(':: Synchronizing package databases...');
   println(' core                                    130.2 KiB   890 KiB/s 00:00 [######################] 100%');
   println(' extra                                   2450.1 KiB  3.1 MiB/s 00:01 [######################] 100%');
   println(' community                                980.4 KiB  2.4 MiB/s 00:00 [######################] 100%');
   pacmanLog('[PACMAN] synchronizing package lists');
   if(op==='-Sy'||op==='-Syy'){
    return {stdout:'',code:0};
   }
  }
  // Обновление системы (-Syu)
  if(op==='-Syu' && !pkgs.length){
   // Проверяем доступные обновления
   const updates = Object.keys(INSTALLED).filter(p => REPO[p] && INSTALLED[p].v !== REPO[p].v);
   if(!updates.length){
    return {stdout:' there is nothing to do\n',code:0};
   }
   println(':: Starting full system upgrade...');
   println(`:: ${updates.length} packages to upgrade:`);
   println(updates.map(p=>`${p} ${INSTALLED[p].v} -> ${REPO[p].v}`).join('\n'));
   state.pendingConfirm={type:'upgrade',pkgs:updates,question:':: Proceed with installation? [Y/n] '};
   return {stdout:'',code:0};
  }
  // Установка пакетов (-S)
  if(!pkgs.length){
   return {stdout:'',stderr:'error: no targets specified (use -h for help)',code:1};
  }
  const notFound=pkgs.filter(p=>!REPO[p]);
  if(notFound.length){let err=notFound.map(p=>`error: target not found: ${p}`).join('\n');return {stdout:'',stderr:err,code:1};}
  // Проверка уже установленных
  const toInstall=[];
  for(const p of pkgs){
   if(!INSTALLED[p]){
    toInstall.push(p);
   }
  }
  if(!toInstall.length){
   return {stdout:' warning: all packages are already installed\n there is nothing to do\n',code:0};
  }
  println('resolving dependencies...');
  println('looking for conflicting packages...');
  // имитация зависимостей: добавляем зависимости из REPO[p].deps
  const depsToInstall = new Set();
  for(const p of toInstall){
   if(REPO[p].deps){
    for(const dep of REPO[p].deps){
     if(!INSTALLED[dep] && !toInstall.includes(dep) && REPO[dep]){
      depsToInstall.add(dep);
     }
    }
   }
  }
  const finalList = [...new Set([...toInstall, ...depsToInstall])];
  println(`Packages (${finalList.length}) ${finalList.map(p=>`${p}-${REPO[p].v}`).join('  ')}`);
  const totalSize=finalList.reduce((s,p)=>s+REPO[p].size,0);
  println(`Total Download Size:   ${(totalSize/1024).toFixed(2)} MiB`);
  println(`Total Installed Size:  ${(totalSize/1024).toFixed(2)} MiB`);
  state.pendingConfirm={type:'install',pkgs:finalList,question:':: Proceed with installation? [Y/n] '};
  return {stdout:'',code:0};
 }

 // Удаление
 if(op==='-R'||op==='-Rs'||op==='-Rns'||op==='--remove'){
  if(!pkgs.length)return {stdout:'',stderr:'error: no targets specified',code:1};
  const notInstalled=pkgs.filter(p=>!INSTALLED[p]);
  if(notInstalled.length){return {stdout:'',stderr:notInstalled.map(p=>`error: target not found: ${p}`).join('\n'),code:1};}
  println('checking dependencies...');
  println(`Packages (${pkgs.length}) ${pkgs.map(p=>`${p}-${INSTALLED[p].v}`).join('  ')}`);
  state.pendingConfirm={type:'remove',pkgs,question:':: Do you want to remove these packages? [Y/n] '};
  return {stdout:'',code:0};
 }

 // Запрос к локальной базе
 if(op==='-Q'||op==='--query'){
  // Перечисление всех
  if(!flags.length && !pkgs.length){
   const names=Object.keys(INSTALLED).sort();
   return {stdout:names.map(n=>`${n} ${INSTALLED[n].v}`).join('\n')+'\n',code:0};
  }
  // Информация о пакете
  if(hasFlag('i')){
   const p=pkgs[0];
   if(!p || !INSTALLED[p]) return {stdout:'',stderr:`error: package '${p}' was not found`,code:1};
   const d=REPO[p]||{desc:'(local package)',repo:'unknown'};
   return {stdout:`Name            : ${p}\nVersion         : ${INSTALLED[p].v}\nDescription     : ${d.desc}\nInstalled Size  : ${(d.size/1024).toFixed(2)} MiB\nInstall Reason  : ${INSTALLED[p].explicit?'Explicitly installed':'Installed as a dependency'}\nInstall Date    : ${new Date(INSTALLED[p].date).toDateString()}\n`,code:0};
  }
  // Список файлов пакета
  if(hasFlag('l')){
   const p=pkgs[0];
   if(!p || !INSTALLED[p]) return {stdout:'',stderr:`error: package '${p}' was not found`,code:1};
   // Имитация: возвращаем заглушку
   return {stdout:`/usr/bin/${p}\n/usr/share/${p}/\n`,code:0};
  }
  // Поиск пакета по файлу
  if(hasFlag('o')){
   const f=pkgs[0];
   if(!f) return {stdout:'',stderr:'error: no file specified',code:1};
   // Простейший поиск
   return {stdout:`/usr/bin/${f} is owned by ${f.split('/').pop()}\n`,code:0};
  }
  // Явно установленные
  if(hasFlag('e')){
   const names=Object.keys(INSTALLED).filter(p=>INSTALLED[p].explicit).sort();
   return {stdout:names.map(n=>`${n} ${INSTALLED[n].v}`).join('\n')+'\n',code:0};
  }
  // Отсутствующие зависимости (orphans)
  if(hasFlag('t')){
   const orphans=Object.keys(INSTALLED).filter(p=>!INSTALLED[p].explicit && !BASE_INSTALL.includes(p)).sort();
   return {stdout:orphans.map(n=>`${n} ${INSTALLED[n].v}`).join('\n')+'\n',code:0};
  }
  // Если просто указаны пакеты
  if(pkgs.length){
   const p=pkgs[0];
   if(!INSTALLED[p]) return {stdout:'',stderr:`error: package '${p}' was not found`,code:1};
   return {stdout:`${p} ${INSTALLED[p].v}\n`,code:0};
  }
  const names=Object.keys(INSTALLED).sort();
  return {stdout:names.map(n=>`${n} ${INSTALLED[n].v}`).join('\n')+'\n',code:0};
 }

 // Очистка кэша
 if(op==='-Sc'||op==='-Scc'){
  println('Cache directory: /var/cache/pacman/pkg/');
  if(op==='-Scc'){
   println(':: Do you want to remove ALL files from cache? [Y/n] ');
   state.pendingConfirm={type:'cleanall',question:':: Do you want to remove ALL files from cache? [Y/n] '};
  } else {
   println(':: Do you want to remove old packages from cache? [Y/n] ');
   state.pendingConfirm={type:'cleanold',question:':: Do you want to remove old packages from cache? [Y/n] '};
  }
  return {stdout:'',code:0};
 }

 // Помощь
 if(op==='-h'||op==='--help'){
  return {stdout:`SintOS Pacman v6.1.0\n\nUsage: pacman <operation> [...]\n\nOperations:\n  -S, --sync       Install packages\n  -R, --remove     Remove packages\n  -Q, --query      Query the package database\n  -Ss <term>       Search for packages\n  -Syu             Update system\n  -Sc              Remove old packages from cache\n  -Scc             Remove all packages from cache\n  -Qdt             List orphaned packages\n  -Qe              List explicitly installed packages\n  -Ql <pkg>        List files owned by package\n  -Qo <file>       Find package that owns file\n  -Si <pkg>        Display remote package info\n  -Qi <pkg>        Display local package info\n  -h, --help       Show this help\n`,code:0};
 }

 // Информация о пакете из репозитория
 if(op==='-Si'||(op==='-S'&&hasFlag('i'))){
  const p=pkgs[0];
  if(!p || !REPO[p]) return {stdout:'',stderr:`error: package '${p}' was not found`,code:1};
  const d=REPO[p];
  return {stdout:`Repository      : ${d.repo}\nName            : ${p}\nVersion         : ${d.v}\nDescription     : ${d.desc}\nDownload Size   : ${(d.size/1024).toFixed(2)} MiB\n`,code:0};
 }

 return {stdout:'',stderr:`error: invalid option: '${op}'`,code:1};
};

function finalizePacmanConfirm(answer){
 const pc=state.pendingConfirm;state.pendingConfirm=null;
 const yes=!answer||/^y(es)?$/i.test(answer.trim());
 if(!yes){println('interrupt (использование отменено)');return;}
 if(pc.type==='install' || pc.type==='upgrade'){
  println((pc.type==='install'?':: Proceed with installation? [Y/n] ':':: Proceed with installation? [Y/n] ')+(answer||'Y'));
  for(const p of pc.pkgs){println(`downloading ${p}-${REPO[p].v}-x86_64.pkg.tar.zst...`);}
  println('checking keys in keyring...');
  println('checking package integrity...');
  println('loading package files...');
  println('checking for file conflicts...');
  println('checking available disk space...');
  for(let i=0;i<pc.pkgs.length;i++){
   const p=pc.pkgs[i];
   println(`(${i+1}/${pc.pkgs.length}) ${pc.type==='install'?'installing':'upgrading'} ${p}...`);
   const ver = REPO[p].v;
   INSTALLED[p]={v:ver,explicit:true,date:Date.now()};
   // Имитация файлов пакета: записываем некоторые файлы в ФС
   const pkgDir = `/var/lib/pacman/local/${p}-${ver}`;
   const localNode = getNode('/var/lib/pacman/local');
   if(localNode){
    localNode.children[`${p}-${ver}`] = D({
      'desc': F(`%NAME%\n${p}\n\n%VERSION%\n${ver}\n`),
      'files': F(`%FILES%\n/usr/bin/${p}\n/usr/share/${p}/\n`)
    });
   }
   pacmanLog(`[ALPM] ${pc.type==='install'?'installed':'upgraded'} ${p} (${ver})`);
  }
  println('');
 } else if(pc.type==='remove'){
  println(':: Do you want to remove these packages? [Y/n] '+(answer||'Y'));
  for(let i=0;i<pc.pkgs.length;i++){
   const p=pc.pkgs[i];
   println(`(${i+1}/${pc.pkgs.length}) removing ${p}...`);
   delete INSTALLED[p];
   // Удаляем локальную базу пакета
   const localNode = getNode('/var/lib/pacman/local');
   if(localNode){
    for(const k in localNode.children){
     if(k.startsWith(`${p}-`)) delete localNode.children[k];
    }
   }
   pacmanLog(`[ALPM] removed ${p}`);
  }
  println('');
 } else if(pc.type==='cleanold'){
  println(':: Do you want to remove old packages from cache? [Y/n] '+(answer||'Y'));
  println('removing old packages from cache...');
 } else if(pc.type==='cleanall'){
  println(':: Do you want to remove ALL files from cache? [Y/n] '+(answer||'Y'));
  println('removing all packages from cache...');
 }
}

const wmContainer=document.getElementById('wmContainer');
const wmGrid=document.getElementById('wmGrid');
const wmClock=document.getElementById('wmClock');
let wmActive=false;
let wmTerms=[];

function startWM(){
 if(wmActive)return;
 wmActive=true;
 inputRow.style.display='none';
 screenEl.style.display='none';
 wmContainer.style.display='flex';
 wmGrid.innerHTML='';
 wmTerms=[];
 for(let i=0;i<4;i++){
  const termDiv=document.createElement('div');
  termDiv.className='wm-term';
  const title=document.createElement('div');
  title.className='wm-term-title';
  title.innerHTML=`<span>Terminal ${i+1}</span><span class="dim">bash</span>`;
  const body=document.createElement('div');
  body.className='wm-term-body';
  const termState={log:body, prompt:null, input:null, cwd:'/home/sinto', user:'sinto', uid:1000, history:[], histIdx:-1};
  termDiv.appendChild(title);
  termDiv.appendChild(body);
  wmGrid.appendChild(termDiv);
  wmTerms.push(termState);
  const promptLine=document.createElement('div');
  promptLine.className='input-line';
  const promptSpan2=document.createElement('span');
  promptSpan2.className='promptSpan';
  promptSpan2.innerHTML=`<span class="prompt-user">sinto</span><span class="dim">@</span><span class="prompt-host">${HOSTNAME}</span><span class="dim">:</span><span class="prompt-path">~</span><span class="prompt-sym">$ </span>`;
  const input=document.createElement('input');
  input.type='text';
  input.autocomplete='off';
  input.spellcheck=false;
  input.style.background='transparent';
  input.style.border='none';
  input.style.outline='none';
  input.style.color='#d4d4d4';
  input.style.fontFamily='inherit';
  input.style.fontSize='13px';
  input.style.flex='1';
  input.style.caretColor='#d4d4d4';
  promptLine.appendChild(promptSpan2);
  promptLine.appendChild(input);
  body.appendChild(promptLine);
  termState.prompt=promptSpan2;
  termState.input=input;
  input.addEventListener('keydown',(e)=>{
   if(e.key==='Enter'){
    const raw=input.value;
    const line=document.createElement('div');
    line.className='line';
    line.innerHTML=termState.prompt.innerHTML+esc(raw);
    body.insertBefore(line, promptLine);
    input.value='';
    const oldCwd=state.cwd;
    state.cwd=termState.cwd;
    const res=runLineRaw(raw);
    state.cwd=oldCwd;
    if(res.stdout){const out=document.createElement('div');out.className='line';out.innerHTML=esc(res.stdout);body.insertBefore(out, promptLine);}
    if(res.stderr){const err=document.createElement('div');err.className='line err';err.innerHTML=esc(res.stderr);body.insertBefore(err, promptLine);}
    body.scrollTop=body.scrollHeight;
   }
  });
 }
 setInterval(()=>{wmClock.textContent=new Date().toTimeString().slice(0,8);},1000);
}
function exitWM(){
 if(!wmActive)return;
 wmActive=false;
 wmContainer.style.display='none';
 screenEl.style.display='block';
 inputRow.style.display='flex';
 cmdInput.focus();
}
document.addEventListener('keydown',(e)=>{
 if(e.ctrlKey&&e.altKey&&e.key==='F1'){
  e.preventDefault();

 }
});

 if(e.key==='l'&&e.ctrlKey){e.preventDefault();logEl.innerHTML='';}

function nowISO(offsetSec) {
  const d = new Date(Date.now() + (offsetSec||0)*1000);
  const pad=n=>String(n).padStart(2,'0');
  const tz=-d.getTimezoneOffset(); const s=tz>=0?'+':'-';
  const h=pad(Math.floor(Math.abs(tz)/60)); const m=pad(Math.abs(tz)%60);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${s}${h}:${m}`;
}
function nowLog(offsetSec) {
  const d=new Date(Date.now()+(offsetSec||0)*1000);
  const pad=n=>String(n).padStart(2,'0');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

// ---- функции работы с путями ----
function normalizePath(path, cwd){
  if(!path) return cwd||'/';
  let parts=path.startsWith('/')?path.split('/'):(cwd||'/')+'/'+path;
  const stack=[];
  for(const p of parts.split('/')){
    if(p===''||p==='.') continue;
    if(p==='..'){if(stack.length)stack.pop(); continue;}
    stack.push(p);
  }
  return '/'+stack.join('/');
}
function getNode(path, follow){
  path=path.replace(/\/+$/,'')||'/';
  if(path==='') path='/';
  const parts=path.split('/').filter(Boolean);
  let node=FS;
  for(let i=0;i<parts.length;i++){
    if(node.type!=='d') return null;
    let child=node.children[parts[i]];
    if(!child) return null;
    let depth=0;
    while(child && child.type==='l' && follow!==false){
      const tgt=child.target.startsWith('/')?child.target:normalizePath(child.target, '/'+parts.slice(0,i).join('/'));
      const rn=getNode(tgt,true);
      if(!rn){child=null; break;}
      child=rn; depth++; if(depth>10) break;
    }
    node=child; if(!node) return null;
  }
  return node;
}
function getParentAndName(path){
  const norm=normalizePath(path, state.cwd);
  const idx=norm.lastIndexOf('/');
  const parentPath=idx===0?'/':norm.slice(0,idx);
  const name=norm.slice(idx+1);
  return {parent:getNode(parentPath), parentPath, name, path:norm};
}

// ТОКЕНИЗАТОР BASH
// ====================================================================
function tokenize(input){
 const tokens=[]; let i=0,n=input.length;
 while(i<n){
  while(i<n&&/\s/.test(input[i])) i++;
  if(i>=n) break;
  if(['|','&','>','<',';','(',')'].includes(input[i])){
   if(input[i]==='&'&&input[i+1]==='&'){tokens.push('&&');i+=2;continue;}
   if(input[i]==='|'&&input[i+1]==='|'){tokens.push('||');i+=2;continue;}
   if(input[i]==='>'&&input[i+1]==='>'){tokens.push('>>');i+=2;continue;}
   tokens.push(input[i]); i++; continue;
  }
  let buf='', quote=null;
  while(i<n){
   const c=input[i];
   if(quote){
    if(c===quote){quote=null;i++;continue;}
    if(quote==='"'&&c==='\\'&&(input[i+1]==='"'||input[i+1]==='\\'||input[i+1]==='$')){buf+=input[i+1];i+=2;continue;}
    buf+=c;i++; continue;
   }
   if(c==='"'||c==="'"){quote=c;i++;continue;}
   if(/\s/.test(c)||['|','&','>','<',';','(',')'].includes(c)) break;
   if(c==='\\'){buf+=input[i+1]||'';i+=2;continue;}
   buf+=c;i++;
  }
  if(buf) tokens.push(buf);
 }
 return tokens;
}
function expandVars(str){
 return str.replace(/\$\{?([A-Za-z_][A-Za-z0-9_]*)\}?/g,(m,name)=>{
  if(name in state.env)return state.env[name];
  if(name in state.vars)return state.vars[name];
  if(name==='?')return String(state.lastStatus);
  if(name==='$')return String(process.pid||0);
  return '';
 }).replace(/\$\?/g,()=>String(state.lastStatus))
 .replace(/\$\(\(([^)]+)\)\)/g,(m,expr)=>String(evalArithmetic(expr)))
 .replace(/\$\(([^)]+)\)/g,(m,cmd)=>runSubshell(cmd))
 .replace(/`([^`]+)`/g,(m,cmd)=>runSubshell(cmd));
}
function evalArithmetic(expr){try{return String(eval(expr))}catch(e){return '0';}}
function runSubshell(cmd){
 const oldCwd=state.cwd;
 const oldEnv=JSON.parse(JSON.stringify(state.env));
 const oldPwd=state.env.PWD;
 const oldOldPwd=state.env.OLDPWD;
 const res=runLineRaw(cmd);
 state.cwd=oldCwd;
 state.env=oldEnv;
 state.env.PWD=oldPwd;
 state.env.OLDPWD=oldOldPwd;
 return res.stdout||'';
}
function splitTop(tokens,seps){const groups=[[]];const joiners=[];for(const t of tokens){if(seps.includes(t)){groups.push([]);joiners.push(t);}else groups[groups.length-1].push(t);}return {groups,joiners};}

// ====================================================================
// ВЫПОЛНЕНИЕ КОМАНДНОЙ СТРОКИ
// ====================================================================
function runLine(line){
 line=line.replace(/^\s+|\s+$/g,'');
 if(!line) return;
 state.history.push(line); state.histIdx=state.history.length;
 const hist=getNode(state.home+'/.bash_history');if(hist)hist.content+=line+'\n';
 const trimmed=line.trim();
 if(trimmed.startsWith('if ')){
  return handleIf(trimmed);
 } else if(trimmed.startsWith('for ')){
  return handleFor(trimmed);
 } else if(trimmed.startsWith('while ')){
  return handleWhile(trimmed);
 } else if(trimmed.startsWith('until ')){
  return handleUntil(trimmed);
 } else if(trimmed.startsWith('case ')){
  return handleCase(trimmed);
 } else if(trimmed.startsWith('function ')||trimmed.match(/^[A-Za-z_][A-Za-z0-9_]*\s*\(\)\s*\{/)){
  return handleFunction(trimmed);
 } else {
  const tokens=tokenize(line);
  if(!tokens.length)return;
  const {groups:seqGroups}=splitTop(tokens,[';']);
  for(const seqTokens of seqGroups){
   if(!seqTokens.length)continue;
   runAndOrChain(seqTokens);
  }
 }
}
function handleIf(line){
 let parts=line.split(';');
 let cond='', thenPart='', elsePart='';
 let state='cond';
 for(let p of parts){
  p=p.trim();
  if(state==='cond' && p.startsWith('if ')){
   cond=p.substring(3).trim();
   state='then';
  } else if(state==='then' && p.startsWith('then')){
   thenPart=p.substring(4).trim();
   state='else';
  } else if(state==='else' && p.startsWith('else')){
   elsePart=p.substring(4).trim();
   state='fi';
  } else if(state==='fi' && p==='fi'){
   break;
  } else {
   if(state==='cond') cond+=' '+p;
   else if(state==='then') thenPart+=' '+p;
   else if(state==='else') elsePart+=' '+p;
  }
 }
 const res=runLineRaw(cond);
 if(res.code===0){
  if(thenPart) runLineRaw(thenPart);
 } else {
  if(elsePart) runLineRaw(elsePart);
 }
}
function handleFor(line){
 let parts=line.split(';');
 let varName='', list=[], cmds='';
 let state='var';
 for(let p of parts){
  p=p.trim();
  if(state==='var' && p.startsWith('for ')){
   const rest=p.substring(4).trim();
   const m=rest.match(/^([A-Za-z_][A-Za-z0-9_]*)\s+in\s+(.+)$/);
   if(m){varName=m[1]; list=m[2].split(/\s+/); state='do';}
  } else if(state==='do' && p==='do'){
   state='done';
  } else if(state==='done' && p==='done'){
   break;
  } else {
   if(state==='do'||state==='done') cmds+=' '+p;
  }
 }
 for(const item of list){
  state.vars[varName]=item;
  runLineRaw(cmds);
 }
}
function handleWhile(line){
 let parts=line.split(';');
 let cond='', cmds='';
 let state='cond';
 for(let p of parts){
  p=p.trim();
  if(state==='cond' && p.startsWith('while ')){
   cond=p.substring(6).trim();
   state='do';
  } else if(state==='do' && p==='do'){
   state='done';
  } else if(state==='done' && p==='done'){
   break;
  } else {
   if(state==='do'||state==='done') cmds+=' '+p;
  }
 }
 while(true){
  const res=runLineRaw(cond);
  if(res.code!==0) break;
  runLineRaw(cmds);
 }
}
function handleUntil(line){
 let parts=line.split(';');
 let cond='', cmds='';
 let state='cond';
 for(let p of parts){
  p=p.trim();
  if(state==='cond' && p.startsWith('until ')){
   cond=p.substring(6).trim();
   state='do';
  } else if(state==='do' && p==='do'){
   state='done';
  } else if(state==='done' && p==='done'){
   break;
  } else {
   if(state==='do'||state==='done') cmds+=' '+p;
  }
 }
 while(true){
  const res=runLineRaw(cond);
  if(res.code===0) break;
  runLineRaw(cmds);
 }
}
function handleCase(line){ return; }
function handleFunction(line){
 let m=line.match(/^(?:function\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*\(\)\s*\{/);
 if(!m) return;
 const name=m[1];
 const body=line.substring(line.indexOf('{')+1, line.lastIndexOf('}')).trim();
 if(!state.functions) state.functions={};
 state.functions[name]=body;
}
function runLineRaw(line){
 const oldLog=[], oldPrint=println;
 let out='', err='';
 println=(s)=>{out+=s+'\n';};
 const res=execLine(line);
 println=oldPrint;
 return {stdout:out, stderr:err, code:res?res.code||0:0};
}
function execLine(line){
 const tokens=tokenize(line);
 if(!tokens.length)return {code:0};
 const {groups:seqGroups}=splitTop(tokens,[';']);
 let code=0;
 for(const seqTokens of seqGroups){
  if(!seqTokens.length)continue;
  code=runAndOrChain(seqTokens);
 }
 return {code};
}
function runAndOrChain(tokens){
 let lastOk=true,first=true;
 let cur=[];
 const flush=(op)=>{
  if(!cur.length)return;
  let run=true;
  if(!first){
   if(op==='&&') run=lastOk;
   else if(op==='||') run=!lastOk;
  }
  if(run){lastOk=(runPipeline(cur)===0);}
  first=false; cur=[];
 };
 let pendingOp=null;
 for(const t of tokens){
  if(t==='&&'||t==='||'){flush(pendingOp);pendingOp=t;continue;}
  cur.push(t);
 }
 flush(pendingOp);
 return lastOk?0:1;
}
function runPipeline(tokens){
 const {groups}=splitTop(tokens,['|']);
 let stdin='';
 let code=0;
 for(let idx=0;idx<groups.length;idx++){
  let g=groups[idx].slice();
  let outFile=null, appendMode=false, inFile=null;
  const cleaned=[];
  for(let j=0;j<g.length;j++){
   if(g[j]==='>'){outFile=g[j+1];j++;continue;}
   if(g[j]==='>>'){outFile=g[j+1];appendMode=true;j++;continue;}
   if(g[j]==='<'){inFile=g[j+1];j++;continue;}
   cleaned.push(g[j]);
  }
  if(inFile){
   const node=getNode(normalizePath(expandVars(inFile),state.cwd));
   stdin=(node&&node.type==='f')?node.content:'';
  }
  const args=cleaned.map(expandVars);
  if(!args.length)continue;
  if(/^[A-Za-z_][A-Za-z0-9_]*=/.test(args[0])&&args.length===1){
   const [k,...r]=args[0].split('=');state.vars[k]=r.join('=');code=0;continue;
  }
  const cmd=args[0];
  const cargs=args.slice(1);
  const result=execCommand(cmd,cargs,stdin);
  code=result.code;
  if(result.stderr) result.stderr.split('\n').forEach(l=>{if(l.length)println(`<span class="err">${esc(l)}</span>`);});
  if(outFile){
   const target=getParentAndName(normalizePath(expandVars(outFile),state.cwd));
   if(target.parent&&target.parent.type==='d'){
    let node=target.parent.children[target.name];
    if(!node||node.type!=='f'){node=F('');target.parent.children[target.name]=node;}
    node.content=appendMode?(node.content+result.stdout):result.stdout;
   }
   stdin='';
  } else if(idx<groups.length-1){
   stdin=result.stdout;
  } else {
   if(result.stdout!==undefined&&result.stdout!==''){
    result.stdout.split('\n').forEach((l,li,arr)=>{
     if(li===arr.length-1&&l==='')return;
     println(esc(l).length?esc(l):'&nbsp;');
    });
   }
  }
 }
 state.lastStatus=code;
 return code;
}

function fmtEntry(name,node){
 if(node.type==='d')return `<span class="dir">${esc(name)}</span>`;
 if(node.type==='l')return `<span class="lnk">${esc(name)}</span><span class="dim"> -> ${esc(node.target)}</span>`;
 if(node.mode&&node.mode.includes('x'))return `<span class="exe">${esc(name)}</span>`;
 return esc(name);
}

function resolveArgPath(p){return normalizePath(p,state.cwd);}
function execCommand(cmd,args,stdin){
 const fn=COMMANDS[cmd];
 if(!fn){
  if(state.functions && state.functions[cmd]){
   const body=state.functions[cmd];
   for(let i=0;i<args.length;i++) state.vars[String(i+1)]=args[i];
   state.vars['#']=String(args.length);
   state.vars['0']=cmd;
   const res=runLineRaw(body);
   for(let i=0;i<args.length;i++) delete state.vars[String(i+1)];
   delete state.vars['#'];
   delete state.vars['0'];
   return {stdout:res.stdout,stderr:res.stderr,code:res.code};
  }
  return {stdout:'',stderr:`bash: ${cmd}: command not found`,code:127};
 }
 try {
  const r=fn(args,stdin);
  if(r&&r.code===undefined) r.code=0;
  if(!r) return {stdout:'',stderr:'',code:0};
  return r;
 } catch(e){return {stdout:'',stderr:`${cmd}: internal error: ${e.message}`,code:1};}
}

// ---- файловые операции ----
COMMANDS['ls']=(args)=>{
 let showAll=false,longFmt=false;
 const targets=[];
 for(const a of args){if(a.startsWith('-')){if(a.includes('a'))showAll=true;if(a.includes('l'))longFmt=true;}else targets.push(a);}
 if(!targets.length)targets.push('.');
 let out=[];
 for(const t of targets){
  const path=resolveArgPath(t);const node=getNode(path);
  if(!node)return {stdout:'',stderr:`ls: cannot access '${t}': No such file or directory`,code:2};
  if(node.type!=='d'){out.push(longFmt?`${node.mode} 1 ${node.owner} ${node.group} ${node.content?node.content.length:0} ${fmtEntry(t,node)}`:fmtEntry(t,node));continue;}
  let names=Object.keys(node.children).sort();if(!showAll)names=names.filter(n=>!n.startsWith('.'));
  if(longFmt){out.push(`total ${names.length}`);names.forEach(n=>{const c=node.children[n];const size=c.type==='f'?(c.content?c.content.length:0):4096;out.push(`${c.mode} 1 ${c.owner} ${c.group} ${String(size).padStart(6)} ${new Date(c.mtime).toDateString().slice(4,10)} ${fmtEntry(n,c)}`);});}else{out.push(names.map(n=>fmtEntry(n,node.children[n])).join('  '));}
 }

COMMANDS['pacman']=(args)=>{
 if(!args.length)return {stdout:'',stderr:'error: no operation specified (use -h for help)',code:1};
 const op=args[0];const rest=args.slice(1);const flags=rest.filter(a=>a.startsWith('-'));const pkgs=rest.filter(a=>!a.startsWith('-'));
 if(op==='-Ss'||(op==='-S'&&flags.some(f=>f.includes('s')))){
  const term=pkgs[0]||'';const re=new RegExp(term,'i');const hits=Object.entries(REPO).filter(([n,d])=>re.test(n)||re.test(d.desc));
  if(!hits.length)return {stdout:'',code:0};let out='';for(const [n,d] of hits){out+=`${d.repo}/${n} ${d.v}${INSTALLED[n]?' [installed]':''}\n    ${d.desc}\n`;}return {stdout:out,code:0};
 }
 if(op==='-S'||op==='-Sy'||op==='-Syu'||op==='--sync'){
  if(op==='-Sy'||op==='-Syu'){
   println(':: Synchronizing package databases...');
   println(' core                                    130.2 KiB   890 KiB/s 00:00 [######################] 100%');
   println(' extra                                   2450.1 KiB  3.1 MiB/s 00:01 [######################] 100%');
   println(' community                                980.4 KiB  2.4 MiB/s 00:00 [######################] 100%');
   if(op==='-Sy'){pacmanLog('[PACMAN] synchronizing package lists');return {stdout:'',code:0};}
  }
  if(!pkgs.length){if(op==='-Syu')return {stdout:' there is nothing to do\n',code:0};return {stdout:'',stderr:'error: no targets specified',code:1};}
  const notFound=pkgs.filter(p=>!REPO[p]);if(notFound.length){let err=notFound.map(p=>`error: target not found: ${p}`).join('\n');return {stdout:'',stderr:err,code:1};}
  const toInstall=pkgs.filter(p=>!INSTALLED[p]);if(!toInstall.length){return {stdout:' there is nothing to do\n',code:0};}
  println('resolving dependencies...');println('looking for conflicting packages...');println('');
  println('Packages ('+toInstall.length+') '+toInstall.map(p=>`${p}-${REPO[p].v}`).join('  '));println('');
  const totalSize=toInstall.reduce((s,p)=>s+REPO[p].size,0);println(`Total Download Size:   ${(totalSize/1024).toFixed(2)} MiB`);println(`Total Installed Size:  ${(totalSize/1024).toFixed(2)} MiB`);println('');
  state.pendingConfirm={type:'install',pkgs:toInstall,question:':: Proceed with installation? [Y/n] '};
  return {stdout:'',code:0};
 }
 if(op==='-R'||op==='-Rs'||op==='--remove'){
  if(!pkgs.length)return {stdout:'',stderr:'error: no targets specified',code:1};
  const notInstalled=pkgs.filter(p=>!INSTALLED[p]);if(notInstalled.length){return {stdout:'',stderr:notInstalled.map(p=>`error: target not found: ${p}`).join('\n'),code:1};}
  println('checking dependencies...');println('');
  println('Packages ('+pkgs.length+') '+pkgs.map(p=>`${p}-${INSTALLED[p].v}`).join('  '));println('');
  state.pendingConfirm={type:'remove',pkgs,question:':: Do you want to remove these packages? [Y/n] '};
  return {stdout:'',code:0};
 }
 if(op==='-Q'||op==='--query'){
  if(flags.some(f=>f.includes('i'))||rest.includes('-i')){
   const p=pkgs[0];if(!p||!INSTALLED[p])return {stdout:'',stderr:`error: package '${p}' was not found`,code:1};const d=REPO[p];return {stdout:`Name            : ${p}\nVersion         : ${INSTALLED[p].v}\nDescription     : ${d.desc}\nInstalled Size  : ${(d.size/1024).toFixed(2)} MiB\nInstall Reason  : ${INSTALLED[p].explicit?'Explicitly installed':'Installed as a dependency'}\n`,code:0};
  }
  if(pkgs.length){const p=pkgs[0];if(!INSTALLED[p])return {stdout:'',stderr:`error: package '${p}' was not found`,code:1};return {stdout:`${p} ${INSTALLED[p].v}\n`,code:0};}
  const names=Object.keys(INSTALLED).sort();return {stdout:names.map(n=>`${n} ${INSTALLED[n].v}`).join('\n')+'\n',code:0};
 }
 if(op==='-h'||op==='--help'){return {stdout:`SintOS Pacman v6.1.0\n\nUsage: pacman <operation> [...]\n\nOperations:\n  -S, --sync       Install packages\n  -R, --remove     Remove packages\n  -Q, --query      Query the package database\n  -Ss <term>       Search for packages\n  -Syu             Update system\n  -h, --help       Show this help\n`,code:0};}
 return {stdout:'',stderr:`error: invalid option: '${op}'`,code:1};
};

function finalizePacmanConfirm(answer){
 const pc=state.pendingConfirm;state.pendingConfirm=null;
 const yes=!answer||/^y(es)?$/i.test(answer.trim());
 if(!yes){println('interrupt (использование отменено)');return;}
 if(pc.type==='install'){
  println(':: Proceed with installation? [Y/n] '+(answer||'Y'));
  for(const p of pc.pkgs){println(`downloading ${p}-${REPO[p].v}-x86_64.pkg.tar.zst...`);}
  println('checking keys in keyring...');println('checking package integrity...');println('loading package files...');println('checking for file conflicts...');println('checking available disk space...');
  for(let i=0;i<pc.pkgs.length;i++){const p=pc.pkgs[i];println(`(${i+1}/${pc.pkgs.length}) installing ${p}...`);const node=getNode('/var/lib/pacman/local');if(node)node.children[`${p}-${REPO[p].v}`]=D({desc:F(`%NAME%\n${p}\n\n%VERSION%\n${REPO[p].v}\n`)});INSTALLED[p]={v:REPO[p].v,explicit:true,date:Date.now()};pacmanLog(`[ALPM] installed ${p} (${REPO[p].v})`);}println('');
 } else if(pc.type==='remove'){
  println(':: Do you want to remove these packages? [Y/n] '+(answer||'Y'));
  for(let i=0;i<pc.pkgs.length;i++){const p=pc.pkgs[i];println(`(${i+1}/${pc.pkgs.length}) removing ${p}...`);delete INSTALLED[p];pacmanLog(`[ALPM] removed ${p}`);}println('');
 }
}

  const input=document.createElement('input');

  input.addEventListener('keydown',(e)=>{
   if(e.key==='Enter'){
    const raw=input.value;

    body.insertBefore(line, promptLine);

    state.cwd=oldCwd;
    if(res.stdout){const out=document.createElement('div');out.className='line';out.innerHTML=esc(res.stdout);body.insertBefore(out, promptLine);}
    if(res.stderr){const err=document.createElement('div');err.className='line err';err.innerHTML=esc(res.stderr);body.insertBefore(err, promptLine);}
    body.scrollTop=body.scrollHeight;
   }
  });
 }
 setInterval(()=>{wmClock.textContent=new Date().toTimeString().slice(0,8);},1000);
}
function exitWM(){
 if(!wmActive)return;
 wmActive=false;
 wmContainer.style.display='none';
 screenEl.style.display='block';
 inputRow.style.display='flex';
 cmdInput.focus();
}
document.addEventListener('keydown',(e)=>{
 if(e.ctrlKey&&e.altKey&&e.key==='F1'){
  e.preventDefault();

 }
});

// ====================================================================
// ВВОД ПОЛЬЗОВАТЕЛЯ
// ====================================================================
cmdInput.addEventListener('keydown',(e)=>{
 if(e.key==='Enter'){
  const raw=cmdInput.value;
  if(!state.loggedIn){cmdInput.value='';handleLoginFlow(raw);return;}
  const promptHtml=promptSpan.innerHTML;
  println(promptHtml+esc(raw));

  if(state.pendingConfirm){finalizePacmanConfirm(raw);updatePrompt();scrollDown();return;}
  runLine(raw);
  updatePrompt();
  scrollDown();
  return;
 }
 if(e.key==='ArrowUp'){if(state.history.length){state.histIdx=Math.max(0,state.histIdx-1);cmdInput.value=state.history[state.histIdx]||'';e.preventDefault();}}
 if(e.key==='ArrowDown'){if(state.history.length){state.histIdx=Math.min(state.history.length,state.histIdx+1);cmdInput.value=state.history[state.histIdx]||'';e.preventDefault();}}
 if(e.key==='l'&&e.ctrlKey){e.preventDefault();logEl.innerHTML='';}
});

<script>
/* ============================================================
   SintOS — симулятор дистрибутива GNU/Linux (Arch-based)
   Полностью виртуальная среда: файловая система, bash, pacman
   ============================================================ */

const screenEl = document.getElementById('screen');
const logEl = document.getElementById('log');
const inputRow = document.getElementById('inputRow');
const cmdInput = document.getElementById('cmdInput');
const promptSpan = document.getElementById('promptSpan');

function nowISO(offsetSec){
  const d = new Date(Date.now() + (offsetSec||0)*1000);
  const pad = n => String(n).padStart(2,'0');
  const tzoff = -d.getTimezoneOffset();
  const sign = tzoff>=0?'+':'-';
  const tzh = pad(Math.floor(Math.abs(tzoff)/60));
  const tzm = pad(Math.abs(tzoff)%60);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${sign}${tzh}:${tzm}`;
}
function nowLog(offsetSec){
  const d = new Date(Date.now() + (offsetSec||0)*1000);
  const pad = n => String(n).padStart(2,'0');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function println(html){
  const div = document.createElement('div');
  div.className='line';
  div.innerHTML = html===undefined?'':html;
  logEl.appendChild(div);
  screenEl.scrollTop = screenEl.scrollHeight;
}
function printlnText(t){ println(esc(t)); }
function scrollDown(){ screenEl.scrollTop = screenEl.scrollHeight; }

/* ============================================================
   ВИРТУАЛЬНАЯ ФАЙЛОВАЯ СИСТЕМА
   ============================================================ */
function D(children,mode,owner,group){ return {type:'d', children:children||{}, mode:mode||'drwxr-xr-x', owner:owner||'root', group:group||'root', mtime:Date.now()}; }
function F(content,mode,owner,group){ return {type:'f', content:content===undefined?'':content, mode:mode||'-rw-r--r--', owner:owner||'root', group:group||'root', mtime:Date.now()}; }
function L(target){ return {type:'l', target:target, mode:'lrwxrwxrwx', owner:'root', group:'root', mtime:Date.now()}; }

const OS_RELEASE =
`NAME="SintOS"
PRETTY_NAME="SintOS"
ID=sintos
ID_LIKE=arch
BUILD_ID=rolling
ANSI_COLOR="38;2;95;175;255"
HOME_URL="https://sintos.example.org/"
DOCUMENTATION_URL="https://wiki.sintos.example.org/"
SUPPORT_URL="https://sintos.example.org/support"

const PACMAN_CONF =
`#
# /etc/pacman.conf
#
[options]
HoldPkg     = pacman glibc
Architecture = x86_64
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

Include = /etc/pacman.d/mirrorlist

Include = /etc/pacman.d/mirrorlist
`;

const MIRRORLIST =
`## SintOS mirrorlist
Server = https://mirror.sintos.example.org/$repo/os/$arch
Server = https://mirror2.sintos.example.org/$repo/os/$arch
`;

const MOTD = `Welcome to SintOS — на основе принципов Arch Linux.\nДокументация: https://wiki.sintos.example.org/\n`;

let hostname = 'sintos';

function buildFS(){
  const root = D({});
  root.children['bin']  = L('usr/bin');
  root.children['sbin'] = L('usr/bin');
  root.children['lib']  = L('usr/lib');
  root.children['lib64']= L('usr/lib');

  root.children['boot'] = D({
    'vmlinuz-linux': F('[binary kernel image]','-rw-r--r--'),

    'grub': D({'grub.cfg': F('set default=0\nset timeout=5\n\nmenuentry "SintOS Linux" {\n  linux /vmlinuz-linux root=UUID=3f2a9c8e-11ab-44de-9c2f-7e0b6a1d9a10 rw\n  initrd /initramfs-linux.img\n}\n')})
  });

  root.children['dev'] = D({
    'sda': F('','brw-rw----'), 'sda1': F('','brw-rw----'), 'sda2': F('','brw-rw----'),
    'tty1': F('','crw--w----'), 'null': F('','crw-rw-rw-'), 'zero': F('','crw-rw-rw-'),

  });

  root.children['etc'] = D({
    'os-release': F(OS_RELEASE),
    'hostname': F(hostname+'\n'),
    'hosts': F('127.0.0.1\tlocalhost\n::1\t\tlocalhost\n127.0.1.1\t'+hostname+'.localdomain\t'+hostname+'\n'),
    'pacman.conf': F(PACMAN_CONF),
    'pacman.d': D({'mirrorlist': F(MIRRORLIST)}),
    'passwd': F('root:x:0:0:root:/root:/bin/bash\nsinto:x:1000:1000:Sinto User:/home/sinto:/bin/bash\n'),
    'shadow': F('root:!*:19700:0:99999:7:::\nsinto:!*:19700:0:99999:7:::\n','-rw-------'),
    'group': F('root:x:0:\nwheel:x:10:sinto\nsinto:x:1000:\n'),
    'fstab': F('UUID=3f2a9c8e-11ab-44de-9c2f-7e0b6a1d9a10  /  ext4  rw,relatime  0 1\nUUID=1a2b3c4d-5e6f-7890-aaaa-bbbbccccdddd  /boot  vfat  rw,relatime  0 2\n'),
    'motd': F(MOTD),
    'resolv.conf': F('nameserver 1.1.1.1\nnameserver 8.8.8.8\n'),
    'locale.conf': F('LANG=en_US.UTF-8\n'),
    'sudoers': F('root ALL=(ALL:ALL) ALL\n%wheel ALL=(ALL:ALL) ALL\n','-r--r-----'),
    'systemd': D({system: D({})}),
  });

  root.children['home'] = D({ 'sinto': D({
      '.bashrc': F('# ~/.bashrc\nPS1="[\\u@\\h \\W]\\$ "\nalias ls="ls --color=auto"\nalias ll="ls -la"\n'),
      '.bash_history': F(''),
      'Documents': D({}), 'Downloads': D({}), 'Music': D({}), 'Pictures': D({}),
  })});

  root.children['media'] = D({});
  root.children['mnt'] = D({});
  root.children['opt'] = D({});
  root.children['proc'] = D({
    'version': F('Linux version 6.10.4-arch1-1 (builduser@sintos) (gcc (SintOS 14.2.1) 14.2.1) #1 SMP PREEMPT_DYNAMIC ' + nowLog(0)+'\n'),
    'cpuinfo': F('processor\t: 0\nvendor_id\t: GenuineIntel\nmodel name\t: Virtual SintOS CPU @ 3.20GHz\ncpu cores\t: 4\n'),
    'meminfo': F('MemTotal:        8123456 kB\nMemFree:         3456789 kB\nSwapTotal:       2097152 kB\nSwapFree:        2097152 kB\n'),
  });

  root.children['root'] = D({
    '.bashrc': F('# ~/.bashrc\nPS1="[\\u@\\h \\W]# "\nalias ls="ls --color=auto"\nalias ll="ls -la"\n'),
    '.bash_history': F(''),
  },'drwx------');

  root.children['run'] = D({});
  root.children['srv'] = D({});
  root.children['sys'] = D({});
  root.children['tmp'] = D({},'drwxrwxrwt');

  root.children['usr'] = D({
    bin: D({}), lib: D({}), local: D({bin:D({}),share:D({})}), share: D({
      'man': D({}),
    }),
  });

  root.children['var'] = D({
    log: D({
      'pacman.log': F(''),
      'boot.log': F(''),
      'auth.log': F(''),
      'Xorg.0.log': F(''),
    }),
    cache: D({ pacman: D({ pkg: D({}) }) }),
    lib: D({ pacman: D({ local: D({}) }) }),
  });

  return root;
}

let FS = buildFS();

function normalizePath(path, cwd){
  if(!path) return cwd;
  let parts;
  if(path.startsWith('/')) parts = path.split('/');
  else parts = (cwd+'/'+path).split('/');
  const stack=[];
  for(const p of parts){
    if(p===''||p==='.') continue;
    if(p==='..'){ if(stack.length) stack.pop(); continue; }
    stack.push(p);
  }
  return '/'+stack.join('/');
}

function getNode(path, follow){
  path = path.replace(/\/+$/,'')||'/';
  if(path==='') path='/';
  const parts = path.split('/').filter(Boolean);
  let node = FS, cur='';
  for(let i=0;i<parts.length;i++){
    if(node.type!=='d') return null;
    let child = node.children[parts[i]];
    if(!child) return null;
    let depth=0;
    while(child && child.type==='l' && (follow!==false)){
      const tgt = child.target.startsWith('/')?child.target:normalizePath(child.target, '/'+parts.slice(0,i).join('/'));
      const rn = getNode(tgt, true);
      if(!rn){ child=null; break; }
      child = rn;
      depth++; if(depth>10) break;
    }
    node = child;
    if(!node) return null;
  }
  return node;
}
function getParentAndName(path){
  const norm = normalizePath(path, state.cwd);
  const idx = norm.lastIndexOf('/');
  const parentPath = idx===0?'/':norm.slice(0,idx);
  const name = norm.slice(idx+1);
  return {parent:getNode(parentPath), parentPath, name, path:norm};
}

/* ============================================================
   СОСТОЯНИЕ СЕССИИ

/* ============================================================
   ПАРСЕР BASH (упрощённый, но функциональный)
   ============================================================ */
function tokenize(input){
  const tokens=[]; let i=0; const n=input.length;
  while(i<n){
    while(i<n && /\s/.test(input[i])) i++;
    if(i>=n) break;
    if(['|','&','>','<',';'].includes(input[i])){
      if(input[i]==='&'&&input[i+1]==='&'){ tokens.push('&&'); i+=2; continue; }
      if(input[i]==='|'&&input[i+1]==='|'){ tokens.push('||'); i+=2; continue; }
      if(input[i]==='>'&&input[i+1]==='>'){ tokens.push('>>'); i+=2; continue; }
      tokens.push(input[i]); i++; continue;
    }
    let buf=''; let quote=null;
    while(i<n){
      const c=input[i];
      if(quote){
        if(c===quote){ quote=null; i++; continue; }
        if(quote==='"' && c==='\\' && (input[i+1]==='"'||input[i+1]==='\\'||input[i+1]==='$')){ buf+=input[i+1]; i+=2; continue; }
        buf+=c; i++; continue;
      }
      if(c==='"'||c==="'"){ quote=c; i++; continue; }
      if(/\s/.test(c) || ['|','&','>','<',';'].includes(c)) break;
      if(c==='\\'){ buf+=input[i+1]||''; i+=2; continue; }
      buf+=c; i++;
    }
    tokens.push(buf);
  }
  return tokens;
}

function expandVars(str){
  return str.replace(/\$\{?([A-Za-z_][A-Za-z0-9_]*)\}?/g, (m,name)=>{
    if(name in state.env) return state.env[name];
    if(name in state.vars) return state.vars[name];
    if(name==='?') return String(state.lastStatus);
    return '';
  }).replace(/\$\?/g, ()=>String(state.lastStatus));
}

function splitTop(tokens, seps){
  const groups=[[]]; const joiners=[];
  for(const t of tokens){
    if(seps.includes(t)){ groups.push([]); joiners.push(t); }
    else groups[groups.length-1].push(t);
  }
  return {groups,joiners};
}

/* Выполнение всей командной строки */
function runLine(line){
  line = line.replace(/^\s+|\s+$/g,'');
  if(!line) return;
  state.history.push(line);
  state.histIdx = state.history.length;
  const hist = getNode(state.home+'/.bash_history');
  if(hist) hist.content += line+'\n';

  let tokens = tokenize(line);
  if(!tokens.length) return;

  const {groups:seqGroups} = splitTop(tokens, [';']);
  for(const seqTokens of seqGroups){
    if(!seqTokens.length) continue;
    runAndOrChain(seqTokens);
  }
}

function runAndOrChain(tokens){
  // разбираем && и || с сохранением порядка через простую свёртку слева направо
  let i=0; let lastOk = true; let first=true;
  let cur=[];
  const flush = (op)=>{
    if(!cur.length) return;
    let run = true;
    if(!first){
      if(op==='&&') run = lastOk;
      else if(op==='||') run = !lastOk;
    }
    if(run){ lastOk = (runPipeline(cur)===0); }
    first=false;
    cur=[];
  };
  let pendingOp=null;
  for(const t of tokens){
    if(t==='&&'||t==='||'){ flush(pendingOp); pendingOp=t; continue; }
    cur.push(t);
  }
  flush(pendingOp);
}

function runPipeline(tokens){
  const {groups} = splitTop(tokens, ['|']);
  let stdin = '';
  let code = 0;
  for(let idx=0; idx<groups.length; idx++){
    let g = groups[idx].slice();
    // редиректы
    let outFile=null, appendMode=false, inFile=null;
    const cleaned=[];
    for(let j=0;j<g.length;j++){
      if(g[j]==='>'){ outFile=g[j+1]; j++; continue; }
      if(g[j]==='>>'){ outFile=g[j+1]; appendMode=true; j++; continue; }
      if(g[j]==='<'){ inFile=g[j+1]; j++; continue; }
      cleaned.push(g[j]);
    }
    if(inFile){
      const node = getNode(normalizePath(expandVars(inFile), state.cwd));
      stdin = (node && node.type==='f') ? node.content : '';
    }
    const args = cleaned.map(expandVars);
    if(!args.length) continue;
    // присваивание переменной VAR=val
    if(/^[A-Za-z_][A-Za-z0-9_]*=/.test(args[0]) && args.length===1){
      const [k,...rest]=args[0].split('=');
      state.vars[k]=rest.join('=');
      code=0; continue;
    }
    const cmd = args[0];
    const cargs = args.slice(1);
    const result = execCommand(cmd, cargs, stdin);
    code = result.code;
    if(result.stderr) result.stderr.split('\n').forEach(l=>{ if(l.length) println(`<span class="err">${esc(l)}</span>`); });
    if(outFile){
      const target = getParentAndName(normalizePath(expandVars(outFile), state.cwd));
      if(target.parent && target.parent.type==='d'){
        let node = target.parent.children[target.name];
        if(!node || node.type!=='f'){ node = F(''); target.parent.children[target.name]=node; }
        node.content = appendMode ? (node.content + result.stdout) : result.stdout;
      }
      stdin='';
    } else if(idx < groups.length-1){
      stdin = result.stdout;
    } else {
      if(result.stdout!==undefined && result.stdout!=='' ){
        result.stdout.split('\n').forEach((l,li,arr)=>{
          if(li===arr.length-1 && l==='') return;
          println(esc(l).length?esc(l):'&nbsp;');
        });
      }
    }
  }
  state.lastStatus = code;
  return code;
}

function fmtEntry(name, node){
  if(node.type==='d') return `<span class="dir">${esc(name)}</span>`;
  if(node.type==='l') return `<span class="lnk">${esc(name)}</span><span class="dim"> -&gt; ${esc(node.target)}</span>`;
  if(node.mode && node.mode.includes('x')) return `<span class="exe">${esc(name)}</span>`;
  return esc(name);
}

   ============================================================ */
function resolveArgPath(p){ return normalizePath(p, state.cwd); }

function permStr(mode){ return mode; }

function execCommand(cmd, args, stdin){
  const fn = COMMANDS[cmd];
  if(!fn){
    return {stdout:'', stderr:`bash: ${cmd}: command not found`, code:127};
  }
  try{
    return fn(args, stdin) || {stdout:'',stderr:'',code:0};
  }catch(e){
    return {stdout:'', stderr:`${cmd}: internal error: ${e.message}`, code:1};
  }

COMMANDS['ls'] = (args)=>{
  let showAll=false, longFmt=false;
  const targets=[];
  for(const a of args){
    if(a.startsWith('-')){
      if(a.includes('a')) showAll=true;
      if(a.includes('l')) longFmt=true;
    } else targets.push(a);
  }
  if(!targets.length) targets.push('.');
  let out=[];
  for(const t of targets){
    const path = resolveArgPath(t);
    const node = getNode(path);
    if(!node) return {stdout:'', stderr:`ls: cannot access '${t}': No such file or directory`, code:2};
    if(node.type!=='d'){
      out.push(longFmt ? `${node.mode} 1 ${node.owner} ${node.group} ${node.content?node.content.length:0} ${fmtEntry(t,node)}` : fmtEntry(t,node));
      continue;
    }
    let names = Object.keys(node.children).sort();
    if(!showAll) names = names.filter(n=>!n.startsWith('.'));
    if(longFmt){
      out.push(`total ${names.length}`);
      names.forEach(n=>{
        const c = node.children[n];
        const size = c.type==='f' ? (c.content?c.content.length:0) : 4096;
        out.push(`${c.mode} 1 ${c.owner} ${c.group} ${String(size).padStart(6)} ${new Date(c.mtime).toDateString().slice(4,10)} ${fmtEntry(n,c)}`);
      });
    } else {
      out.push(names.map(n=>fmtEntry(n,node.children[n])).join('  '));
    }
  }
  return {stdout: out.join('\n')+'\n', code:0};
};

COMMANDS['mkdir'] = (args)=>{
  let parents=false; const targets=[];
  args.forEach(a=>{ if(a==='-p') parents=true; else targets.push(a); });
  if(!targets.length) return {stdout:'',stderr:'mkdir: missing operand',code:1};
  let err='';
  for(const t of targets){
    const path = resolveArgPath(t);
    if(getNode(path)){ err+=`mkdir: cannot create directory '${t}': File exists\n`; continue; }
    const parts = path.split('/').filter(Boolean);
    let cur = FS; let curPath='';
    for(let i=0;i<parts.length;i++){
      curPath += '/'+parts[i];
      if(!cur.children[parts[i]]){
        if(i<parts.length-1 && !parents){ err+=`mkdir: cannot create directory '${t}': No such file or directory\n`; cur=null; break; }
        cur.children[parts[i]] = D({}, 'drwxr-xr-x', state.user, state.user);
      }
      cur = cur.children[parts[i]];
      if(cur.type!=='d'){ err+=`mkdir: '${t}': Not a directory\n`; cur=null; break; }
    }
  }
  return {stdout:'', stderr: err.trim(), code: err?1:0};
};

COMMANDS['touch'] = (args)=>{

    if(!parent || parent.type!=='d') return {stdout:'',stderr:`touch: cannot touch '${t}': No such file or directory`, code:1};
    if(parent.children[name]) parent.children[name].mtime = Date.now();
    else parent.children[name] = F('', '-rw-r--r--', state.user, state.user);
  }
  return {stdout:'', code:0};
};

COMMANDS['cat'] = (args, stdin)=>{
  if(!args.length) return {stdout: stdin||'', code:0};
  let out=''; let err='';
  for(const t of args){
    const path = resolveArgPath(t);
    const node = getNode(path);
    if(!node){ err+=`cat: ${t}: No such file or directory\n`; continue; }
    if(node.type==='d'){ err+=`cat: ${t}: Is a directory\n`; continue; }
    out += node.content;
    if(!out.endsWith('\n')) out+='\n';
  }
  return {stdout:out, stderr: err.trim(), code: err?1:0};
};

function readFileArgOrStdin(args, stdin){
  if(args.length){
    const node = getNode(resolveArgPath(args[0]));
    if(!node) return {err:`No such file or directory`};
    if(node.type==='d') return {err:`Is a directory`};
    return {text: node.content};
  }
  return {text: stdin||''};
}

COMMANDS['grep'] = (args,stdin)=>{
  let ignoreCase=false, invert=false; const rest=[];
  args.forEach(a=>{ if(a==='-i') ignoreCase=true; else if(a==='-v') invert=true; else rest.push(a); });
  const pattern = rest[0];
  if(pattern===undefined) return {stdout:'', stderr:'Usage: grep [OPTION]... PATTERN [FILE]...', code:2};
  const files = rest.slice(1);
  let text;
  if(files.length){
    const node = getNode(resolveArgPath(files[0]));
    if(!node) return {stdout:'', stderr:`grep: ${files[0]}: No such file or directory`, code:2};
    text = node.content;
  } else text = stdin||'';
  let re;
  try{ re = new RegExp(pattern, ignoreCase?'i':''); }catch(e){ return {stdout:'',stderr:'grep: invalid pattern',code:2}; }
  const lines = text.split('\n').filter((l,i,arr)=>!(i===arr.length-1&&l===''));
  const matched = lines.filter(l=> invert ? !re.test(l) : re.test(l));
  return {stdout: matched.join('\n')+(matched.length?'\n':''), code: matched.length?0:1};
};
COMMANDS['find'] = (args)=>{
  const start = args[0] && !args[0].startsWith('-') ? args[0] : '.';
  let nameFilter=null;
  const ni = args.indexOf('-name');
  if(ni>=0) nameFilter = args[ni+1].replace(/\*/g,'.*');
  const startPath = resolveArgPath(start);
  const startNode = getNode(startPath);
  if(!startNode) return {stdout:'', stderr:`find: '${start}': No such file or directory`, code:1};
  const out=[];
  (function walk(path,node){
    const base = path.split('/').pop()||'/';
    if(!nameFilter || new RegExp('^'+nameFilter+'$').test(base)) out.push(path||'/');
    if(node.type==='d'){
      Object.keys(node.children).sort().forEach(k=> walk((path==='/'?'':path)+'/'+k, node.children[k]));
    }
  })(startPath===('/')?'':startPath, startNode);
  return {stdout: out.join('\n')+'\n', code:0};
};

COMMANDS['rm'] = (args)=>{
  let recursive=false, force=false; const targets=[];
  args.forEach(a=>{ if(a.startsWith('-')){ if(a.includes('r')) recursive=true; if(a.includes('f')) force=true; } else targets.push(a); });
  let err='';
  for(const t of targets){
    const {parent,name} = getParentAndName(t);
    if(!parent || !parent.children[name]){ if(!force) err+=`rm: cannot remove '${t}': No such file or directory\n`; continue; }
    const node = parent.children[name];
    if(node.type==='d' && !recursive){ err+=`rm: cannot remove '${t}': Is a directory\n`; continue; }
    delete parent.children[name];
  }
  return {stdout:'', stderr: err.trim(), code: err?1:0};
};
COMMANDS['rmdir'] = (args)=>{
  let err='';
  for(const t of args){
    const {parent,name} = getParentAndName(t);
    const node = parent && parent.children[name];
    if(!node){ err+=`rmdir: failed to remove '${t}': No such file or directory\n`; continue; }
    if(node.type!=='d'){ err+=`rmdir: failed to remove '${t}': Not a directory\n`; continue; }
    if(Object.keys(node.children).length){ err+=`rmdir: failed to remove '${t}': Directory not empty\n`; continue; }
    delete parent.children[name];
  }
  return {stdout:'', stderr:err.trim(), code: err?1:0};
};
COMMANDS['cp'] = (args)=>{
  let recursive=false; const rest=[];
  args.forEach(a=>{ if(a==='-r'||a==='-R') recursive=true; else rest.push(a); });
  if(rest.length<2) return {stdout:'',stderr:'cp: missing file operand',code:1};
  const src = getNode(resolveArgPath(rest[0]));
  if(!src) return {stdout:'',stderr:`cp: cannot stat '${rest[0]}': No such file or directory`, code:1};
  if(src.type==='d' && !recursive) return {stdout:'',stderr:`cp: -r not specified; omitting directory '${rest[0]}'`, code:1};
  const {parent,name} = getParentAndName(rest[1]);
  if(!parent) return {stdout:'',stderr:`cp: cannot create '${rest[1]}'`, code:1};
  parent.children[name] = JSON.parse(JSON.stringify(src));
  return {stdout:'', code:0};
};
COMMANDS['mv'] = (args)=>{
  if(args.length<2) return {stdout:'',stderr:'mv: missing file operand',code:1};
  const {parent:sp, name:sn} = getParentAndName(args[0]);
  if(!sp || !sp.children[sn]) return {stdout:'',stderr:`mv: cannot stat '${args[0]}': No such file or directory`, code:1};
  const node = sp.children[sn];
  let destPath = resolveArgPath(args[1]);
  const destNode = getNode(destPath);
  if(destNode && destNode.type==='d'){
    destPath = destPath.replace(/\/+$/,'')+'/'+sn;
  }
  const {parent:dp, name:dn} = getParentAndName(destPath);
  if(!dp) return {stdout:'',stderr:`mv: cannot move to '${args[1]}'`, code:1};
  dp.children[dn]=node;
  delete sp.children[sn];
  return {stdout:'',code:0};
};

COMMANDS['tree'] = (args)=>{
  const start = resolveArgPath(args[0]||'.');
  const node = getNode(start);
  if(!node) return {stdout:'',stderr:'tree: not found',code:1};
  const lines=[start];
  (function walk(n, prefix){
    const keys = Object.keys(n.children||{}).sort();
    keys.forEach((k,i)=>{
      const last = i===keys.length-1;
      lines.push(prefix + (last?'└── ':'├── ') + k);
      if(n.children[k].type==='d') walk(n.children[k], prefix + (last?'    ':'│   '));

  })(node, '');
  return {stdout: lines.join('\n')+'\n', code:0};
};
